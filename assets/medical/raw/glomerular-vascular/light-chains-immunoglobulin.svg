<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880">
  <defs>
    <radialGradient id="plasmaGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
    <radialGradient id="plasmaGradL" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ddd6fe"/>
      <stop offset="70%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </radialGradient>
    <linearGradient id="kidneyK" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fecaca"/>
      <stop offset="65%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="kidneyL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="65%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="880" fill="#f8fafc"/>

  <!-- ===== TITLE ===== -->
  <text x="600" y="44" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
        font-size="26" font-weight="700" fill="#0f172a">
    Light Chains &amp; the Kidney — Animated Teaching Module
  </text>
  <text x="600" y="70" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
        font-size="14" fill="#64748b">
    Monoclonal gammopathy of renal significance (MGRS) · Educational use only
  </text>

  <!-- =========================================================
       LANE 1 — KAPPA
       ========================================================= -->
  <rect x="30" y="95" width="1140" height="175" rx="18" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="48" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="17"
        font-weight="800" fill="#1e40af">
    HIGH KAPPA κ  ·  κ/λ ratio &gt; 1.65
  </text>
  <text x="48" y="143" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#3b82f6">
    Kappa-predominant clone  →  LCDD · Cast nephropathy · PGNMID · Proximal tubulopathy
  </text>

  <!-- plasma cell -->
  <circle cx="120" cy="200" r="46" fill="url(#plasmaGrad)" filter="url(#soft)">
    <animate attributeName="r" values="46;49;46" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="200" r="20" fill="#78350f" opacity="0.85"/>
  <text x="120" y="268" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
        font-size="13" font-weight="700" fill="#1e40af">Kappa plasma cell</text>

  <!-- kidney -->
  <g transform="translate(1045,200)">
    <path d="M 44,-30 C 58,-6 56,26 36,44 C 14,62 -24,60 -42,38
             C -56,20 -54,-14 -36,-32 C -18,-48 28,-50 44,-30 Z"
          fill="url(#kidneyK)" stroke="#991b1b" stroke-width="2" filter="url(#soft)">
      <animateTransform attributeName="transform" type="scale"
                        values="1;1.05;1" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>
  <text x="1045" y="268" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
        font-size="13" font-weight="700" fill="#1e40af">Kappa deposits</text>

  <!-- flow line -->
  <line x1="195" y1="200" x2="960" y2="200" stroke="#93c5fd" stroke-width="2"
        stroke-dasharray="8 8" opacity="0.7">
    <animate attributeName="stroke-dashoffset" values="0;-32" dur="1.2s" repeatCount="indefinite"/>
  </line>

  <!-- kappa particles -->
  <g fill="#2563eb">
    <circle r="9" cy="200">
      <animateMotion dur="3.3s" begin="0s" repeatCount="indefinite" path="M195,200 L960,200"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1"
               dur="3.3s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle r="9" cy="200">
      <animateMotion dur="3.3s" begin="0.55s" repeatCount="indefinite" path="M195,200 L960,200"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1"
               dur="3.3s" begin="0.55s" repeatCount="indefinite"/>
    </circle>
    <circle r="9" cy="200">
      <animateMotion dur="3.3s" begin="1.1s" repeatCount="indefinite" path="M195,200 L960,200"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1"
               dur="3.3s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle r="9" cy="200">
      <animateMotion dur="3.3s" begin="1.65s" repeatCount="indefinite" path="M195,200 L960,200"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1"
               dur="3.3s" begin="1.65s" repeatCount="indefinite"/>
    </circle>
    <circle r="9" cy="200">
      <animateMotion dur="3.3s" begin="2.2s" repeatCount="indefinite" path="M195,200 L960,200"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1"
               dur="3.3s" begin="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="9" cy="200">
      <animateMotion dur="3.3s" begin="2.75s" repeatCount="indefinite" path="M195,200 L960,200"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1"
               dur="3.3s" begin="2.75s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- =========================================================
       LANE 2 — LAMBDA
       ========================================================= -->
  <rect x="30" y="285" width="1140" height="175" rx="18" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="2"/>
  <text x="48" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="17"
        font-weight="800" fill="#5b21b6">
    HIGH LAMBDA λ  ·  κ/λ ratio &lt; 0.26
  </text>
  <text x="48" y="333" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#7c3aed">
    Lambda-predominant clone  →  AL amyloidosis (most classic association)
  </text>

  <!-- plasma cell -->
  <circle cx="120" cy="390" r="46" fill="url(#plasmaGradL)" filter="url(#soft)">
    <animate attributeName="r" values="46;49;46" dur="3.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="390" r="20" fill="#4c1d95" opacity="0.85"/>
  <text x="120" y="458" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
        font-size="13" font-weight="700" fill="#5b21b6">Lambda plasma cell</text>

  <!-- kidney -->
  <g transform="translate(1045,390)">
    <path d="M 44,-30 C 58,-6 56,26 36,44 C 14,62 -24,60 -42,38
             C -56,20 -54,-14 -36,-32 C -18,-48 28,-50 44,-30 Z"
          fill="url(#kidneyL)" stroke="#6b21a8" stroke-width="2" filter="url(#soft)">
      <animateTransform attributeName="transform" type="scale"
                        values="1;1.05;1" dur="4.6s" repeatCount="indefinite"/>
    </path>
  </g>
  <text x="1045" y="458" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
        font-size="13" font-weight="700" fill="#5b21b6">Lambda fibrils (amyloid)</text>

  <!-- flow line -->
  <line x1="195" y1="390" x2="960" y2="390" stroke="#c4b5fd" stroke-width="2"
        stroke-dasharray="8 8" opacity="0.7">
    <animate attributeName="stroke-dashoffset" values="0;-32" dur="1.5s" repeatCount="indefinite"/>
  </line>

  <!-- lambda particles -->
  <g fill="#7c3aed">
    <circle r="9" cy="390">
      <animateMotion dur="4.1s" begin="0s" repeatCount="indefinite" path="M195,390 L960,390"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1"
               dur="4.1s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle r="9" cy="390">
      <animateMotion dur="4.1s" begin="0.68s" repeatCount="indefinite" path="M195,390 L960,390"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1"
               dur="4.1s" begin="0.68s" repeatCount="indefinite"/>
    </circle>
    <circle r="9" cy="390">
      <animateMotion dur="4.1s" begin="1.37s" repeatCount="indefinite" path="M195,390 L960,390"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1"
               dur="4.1s" begin="1.37s" repeatCount="indefinite"/>
    </circle>
    <circle r="9" cy="390">
      <animateMotion dur="4.1s" begin="2.05s" repeatCount="indefinite" path="M195,390 L960,390"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1"
               dur="4.1s" begin="2.05s" repeatCount="indefinite"/>
    </circle>
    <circle r="9" cy="390">
      <animateMotion dur="4.1s" begin="2.73s" repeatCount="indefinite" path="M195,390 L960,390"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1"
               dur="4.1s" begin="2.73s" repeatCount="indefinite"/>
    </circle>
    <circle r="9" cy="390">
      <animateMotion dur="4.1s" begin="3.42s" repeatCount="indefinite" path="M195,390 L960,390"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1"
               dur="4.1s" begin="3.42s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- =========================================================
       TABLE
       ========================================================= -->
  <text x="40" y="500" font-family="Segoe UI, Arial, sans-serif" font-size="17"
        font-weight="800" fill="#0f172a">
    Disease ↔ Light Chain Association
  </text>

  <rect x="30" y="516" width="1140" height="38" rx="8" fill="#1e293b"/>
  <text x="46"  y="541" font-family="Segoe UI, Arial, sans-serif" font-size="13"
        font-weight="700" fill="#ffffff">KIDNEY LESION</text>
  <text x="400" y="541" font-family="Segoe UI, Arial, sans-serif" font-size="13"
        font-weight="700" fill="#ffffff">USUAL LIGHT CHAIN</text>
  <text x="620" y="541" font-family="Segoe UI, Arial, sans-serif" font-size="13"
        font-weight="700" fill="#ffffff">BIOPSY / CLINICAL CLUE</text>

  <!-- row 1 : lambda -->
  <rect x="30" y="558" width="1140" height="46" fill="#f5f3ff"/>
  <rect x="30" y="558" width="6" height="46" fill="#7c3aed"/>
  <text x="46"  y="586" font-family="Segoe UI, Arial, sans-serif" font-size="14"
        font-weight="700" fill="#0f172a">AL amyloidosis</text>
  <text x="400" y="586" font-family="Segoe UI, Arial, sans-serif" font-size="14"
        font-weight="700" fill="#5b21b6">Lambda λ  (~70–80%)</text>
  <text x="620" y="586" font-family="Segoe UI, Arial, sans-serif" font-size="13"
        fill="#334155">Congo red POSITIVE · apple-green birefringence · nephrotic syndrome</text>

  <!-- row 2 : kappa -->
  <rect x="30" y="604" width="1140" height="46" fill="#eff6ff"/>
  <rect x="30" y="604" width="6" height="46" fill="#2563eb"/>
  <text x="46"  y="632" font-family="Segoe UI, Arial, sans-serif" font-size="14"
        font-weight="700" fill="#0f172a">Light chain deposition disease</text>
  <text x="400" y="632" font-family="Segoe UI, Arial, sans-serif" font-size="14"
        font-weight="700" fill="#1e40af">Kappa κ  (~70–80%)</text>
  <text x="620" y="632" font-family="Segoe UI, Arial, sans-serif" font-size="13"
        fill="#334155">Congo red NEGATIVE · amorphous deposits · nodular sclerosis</text>

  <!-- row 3 : kappa -->
  <rect x="30" y="650" width="1140" height="46" fill="#eff6ff"/>
  <rect x="30" y="650" width="6" height="46" fill="#2563eb"/>
  <text x="46"  y="678" font-family="Segoe UI, Arial, sans-serif" font-size="14"
        font-weight="700" fill="#0f172a">Proliferative GN with monoclonal Ig deposition</text>
  <text x="400" y="678" font-family="Segoe UI, Arial, sans-serif" font-size="14"
        font-weight="700" fill="#1e40af">Kappa κ  (more often)</text>
  <text x="620" y="678" font-family="Segoe UI, Arial, sans-serif" font-size="13"
        fill="#334155">Endocapillary proliferation · LOW C3/C4 · small clone</text>

  <!-- row 4 : kappa -->
  <rect x="30" y="696" width="1140" height="46" fill="#eff6ff"/>
  <rect x="30" y="696" width="6" height="46" fill="#2563eb"/>
  <text x="46"  y="724" font-family="Segoe UI, Arial, sans-serif" font-size="14"
        font-weight="700" fill="#0f172a">Cast nephropathy</text>
  <text x="400" y="724" font-family="Segoe UI, Arial, sans-serif" font-size="14"
        font-weight="700" fill="#1e40af">Kappa κ  (more common)</text>
  <text x="620" y="724" font-family="Segoe UI, Arial, sans-serif" font-size="13"
        fill="#334155">Tubular casts · AKI · usually multiple myeloma</text>

  <!-- row 5 : kappa -->
  <rect x="30" y="742" width="1140" height="46" fill="#eff6ff"/>
  <rect x="30" y="742" width="6" height="46" fill="#2563eb"/>
  <text x="46"  y="770" font-family="Segoe UI, Arial, sans-serif" font-size="14"
        font-weight="700" fill="#0f172a">Light chain proximal tubulopathy</text>
  <text x="400" y="770" font-family="Segoe UI, Arial, sans-serif" font-size="14"
        font-weight="700" fill="#1e40af">Kappa κ  (more common)</text>
  <text x="620" y="770" font-family="Segoe UI, Arial, sans-serif" font-size="13"
        fill="#334155">Proximal tubule crystals · Fanconi syndrome · low-grade proteinuria</text>

  <!-- ===== FOOTER ===== -->
  <rect x="30" y="806" width="1140" height="46" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="48" y="834" font-family="Segoe UI, Arial, sans-serif" font-size="13"
        font-weight="700" fill="#9a3412">
    ⚠ Educational use only — not a medical record — not for clinical decision-making.
  </text>

  <text x="48" y="868" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">
    Reviewed by: ______________________________     Date: ______________
  </text>
  <text x="1150" y="868" text-anchor="end" font-family="Segoe UI, Arial, sans-serif"
        font-size="11" fill="#94a3b8">
    Signature must be added by the responsible licensed clinician.
  </text>
</svg>
