<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nephro Challenge AI — Lesson animation</title>
  <link rel="icon" href="https://zub165.github.io/nephro-challenge-ai/favicon.png" />
  <style>
    :root { --navy:#0f2a4a; --teal:#0d9488; --bg:#f4f7fb; --card:#fff; --line:#d7e0ea; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Inter, system-ui, sans-serif; background:var(--bg); color:#142033; }
    header { background: linear-gradient(135deg,#0f2a4a,#134e4a); color:#fff; padding:28px 20px 22px; }
    .wrap { max-width: 720px; margin: 0 auto; }
    a { color:#99f6e4; }
    h1 { margin:8px 0 6px; font-size: clamp(1.4rem, 3vw, 1.9rem); }
    .sub { opacity:.9; }
    main { max-width: 720px; margin: 0 auto; padding: 20px 16px 64px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; }
    .step { font-size:13px; color:#0f766e; font-weight:700; letter-spacing:.04em; text-transform:uppercase; }
    .title { font-size:1.25rem; font-weight:700; margin:8px 0; }
    .body { line-height:1.6; }
    .tip { margin-top:14px; background:#fffbeb; border:1px solid #fcd34d; border-radius:12px; padding:12px 14px; }
    .metrics { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
    .metric { background:#ecfeff; border:1px solid #99f6e4; border-radius:999px; padding:6px 10px; font-size:13px; }
    .nav { display:flex; gap:8px; margin-top:18px; flex-wrap:wrap; }
    button { background:var(--navy); color:#fff; border:0; border-radius:10px; padding:10px 14px; cursor:pointer; font-size:15px; }
    button.ghost { background:#fff; color:var(--navy); border:1px solid var(--line); }
    .err { color:#b91c1c; padding:24px; }
    footer { max-width:720px; margin:0 auto; padding:0 16px 40px; color:#64748b; font-size:13px; }
    footer a { color:#0f766e; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <p style="margin:0; letter-spacing:.12em; font-size:12px; text-transform:uppercase; opacity:.8">Nephro Challenge AI · © Innovators Generation</p>
      <h1 id="title">Loading lesson…</h1>
      <p class="sub" id="subtitle"></p>
    </div>
  </header>
  <main>
    <div class="card" id="card">Loading…</div>
    <div class="nav">
      <button type="button" class="ghost" id="prev">Previous</button>
      <button type="button" id="play">Play</button>
      <button type="button" class="ghost" id="next">Next</button>
    </div>
  </main>
  <footer>
    <a href="index.html">All lessons</a> ·
    <a href="https://zub165.github.io/nephro-challenge-ai/app/">Open app</a>
  </footer>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var src = (params.get('src') || '').replace(/^.*\//, '');
      if (!/^[a-z0-9-]+\.json$/i.test(src)) {
        document.getElementById('card').innerHTML = '<p class="err">Missing or invalid animation file.</p>';
        return;
      }
      var i = 0, timer = null, data = null;
      function render() {
        if (!data || !data.steps || !data.steps.length) return;
        var step = data.steps[i];
        var metrics = '';
        if (step.metrics) {
          metrics = '<div class="metrics">' + Object.keys(step.metrics).map(function (k) {
            return '<span class="metric"><strong>' + k + '</strong> ' + String(step.metrics[k]) + '</span>';
          }).join('') + '</div>';
        }
        document.getElementById('title').textContent = data.title || src;
        document.getElementById('subtitle').textContent = data.subtitle || '';
        document.title = (data.title || 'Lesson') + ' — Nephro Challenge AI';
        document.getElementById('card').innerHTML =
          '<div class="step">Step ' + (i + 1) + ' of ' + data.steps.length + '</div>' +
          '<div class="title">' + (step.title || '') + '</div>' +
          '<p class="body">' + (step.body || '') + '</p>' +
          (step.tip ? '<div class="tip"><strong>Pearl:</strong> ' + step.tip + '</div>' : '') +
          metrics;
      }
      function stop() {
        if (timer) { clearInterval(timer); timer = null; }
        document.getElementById('play').textContent = 'Play';
      }
      document.getElementById('prev').onclick = function () {
        stop();
        i = (i + data.steps.length - 1) % data.steps.length;
        render();
      };
      document.getElementById('next').onclick = function () {
        stop();
        i = (i + 1) % data.steps.length;
        render();
      };
      document.getElementById('play').onclick = function () {
        if (timer) { stop(); return; }
        document.getElementById('play').textContent = 'Pause';
        timer = setInterval(function () {
          i = (i + 1) % data.steps.length;
          render();
        }, 4500);
      };
      fetch(src, { cache: 'no-store' }).then(function (r) {
        if (!r.ok) throw new Error(r.status);
        return r.json();
      }).then(function (json) {
        data = json;
        render();
      }).catch(function () {
        document.getElementById('card').innerHTML = '<p class="err">Could not load this animation.</p>';
      });
    })();
  </script>
</body>
</html>
