<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mixed Acid-Base Disorder — Septic Shock + Diarrhea</title>
<style>
  :root{ --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --bg:#f1f5f9;
    --opt1:#dc2626; --opt2:#7c3aed; --opt3:#0891b2; --opt4:#ca8a04; }
  *{box-sizing:border-box;}
  body{margin:0; font-family:"Inter","Segoe UI",system-ui,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.5; font-size:16px;}
  .wrap{max-width:1300px;margin:0 auto;padding:20px 18px 40px;}

  header.top{display:flex; flex-wrap:wrap; gap:12px; align-items:center;
    justify-content:space-between; margin-bottom:14px;}
  header.top h1{margin:0; font-size:1.35rem; font-weight:800;}
  header.top p{margin:2px 0 0; font-size:.82rem; color:var(--muted);}
  .badge{background:#0f172a; color:#fff; font-size:.72rem; padding:7px 14px;
    border-radius:999px; letter-spacing:.06em; font-weight:700;}

  .case-strip{background:#fff; border-radius:14px; padding:16px 20px;
    border:1px solid var(--line); border-left:5px solid var(--opt1);
    box-shadow:0 1px 3px rgba(15,23,42,.04); margin-bottom:14px;
    display:flex; flex-wrap:wrap; gap:16px; align-items:center;}
  .case-strip h2{margin:0 0 4px; font-size:1rem; font-weight:800; color:#991b1b;}
  .case-strip p{margin:0; font-size:.85rem; color:#334155; line-height:1.55;}
  .labs{display:flex; gap:8px; flex-wrap:wrap;}
  .lab-chip{background:#f1f5f9; border-radius:9px; padding:6px 12px;
    font-size:.75rem; font-weight:700; color:#1e293b; border:1px solid var(--line);
    font-family:"JetBrains Mono",monospace;}
  .lab-chip.abn{background:#fef2f2; border-color:#fecaca; color:#991b1b;}

  .tabs{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;}
  .tab{background:#fff; border:1.5px solid transparent; padding:10px 18px;
    border-radius:10px; font-size:.85rem; font-weight:700; cursor:pointer;
    transition:all .15s ease; color:var(--muted); font-family:inherit;}
  .tab:hover{border-color:#cbd5e1;}
  .tab.opt1.active{background:#fef2f2; border-color:var(--opt1); color:#991b1b;}
  .tab.opt2.active{background:#f5f3ff; border-color:var(--opt2); color:#5b21b6;}
  .tab.opt3.active{background:#cffafe; border-color:var(--opt3); color:#155e75;}
  .tab.opt4.active{background:#fef9c3; border-color:var(--opt4); color:#713f12;}

  .stage{background:#fff; border-radius:16px; padding:12px;
    box-shadow:0 1px 3px rgba(15,23,42,.04), 0 4px 14px rgba(15,23,42,.05);
    border:1px solid var(--line); position:relative;}
  svg.diagram{width:100%; height:auto; display:block;}

  .info-float{position:absolute; top:80px; right:20px;
    background:rgba(255,255,255,.97); backdrop-filter:blur(6px);
    border-radius:12px; padding:0; border:1px solid var(--line);
    box-shadow:0 4px 16px rgba(15,23,42,.1); width:260px;
    max-width:calc(100% - 40px); transition:all .3s cubic-bezier(.4,0,.2,1);
    overflow:hidden; z-index:10;}
  .info-float.highlight-opt1{border-color:var(--opt1);}
  .info-float.highlight-opt2{border-color:var(--opt2);}
  .info-float.highlight-opt3{border-color:var(--opt3);}
  .info-float.highlight-opt4{border-color:var(--opt4);}
  .info-header{display:flex; justify-content:space-between; align-items:center;
    padding:12px 14px; cursor:pointer; user-select:none;
    background:#fef2f2; transition:all .2s ease;}
  .info-float.highlight-opt2 .info-header{background:#f5f3ff;}
  .info-float.highlight-opt3 .info-header{background:#cffafe;}
  .info-float.highlight-opt4 .info-header{background:#fef9c3;}
  .info-header h4{margin:0; font-size:.82rem; font-weight:800;
    color:#0f172a; display:flex; align-items:center; gap:6px;}
  .info-header .toggle-btn{font-size:.72rem; color:var(--muted);
    background:rgba(0,0,0,.06); padding:3px 8px; border-radius:999px; font-weight:700;}
  .info-body{padding:12px 14px 14px; max-height:500px;
    transition:all .3s cubic-bezier(.4,0,.2,1); overflow:hidden;}
  .info-float.collapsed .info-body{max-height:0; padding:0 14px;}
  .info-float .row{display:flex; justify-content:space-between;
    padding:8px 0; font-size:.78rem; border-bottom:1px solid var(--line);}
  .info-float .row:last-child{border:none;}
  .info-float .k{color:var(--muted); font-weight:600; flex-shrink:0;}
  .info-float .v{font-weight:800; color:#0f172a; text-align:right;
    word-break:break-word; max-width:155px; line-height:1.35;}

  .panels{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px;}
  @media(max-width:800px){.panels{grid-template-columns:1fr;}}
  .panel{background:#fff; border-radius:14px; padding:18px 20px;
    box-shadow:0 1px 3px rgba(15,23,42,.04), 0 4px 14px rgba(15,23,42,.05);
    border:1px solid var(--line); border-top:4px solid var(--opt1);}
  .panel.two{border-top-color:#475569;}
  .panel h3{margin:0 0 4px; font-size:1rem; font-weight:800;
    display:flex; align-items:center; gap:8px;}
  .panel .tagline{font-size:.78rem; color:var(--muted); margin:0 0 12px;}
  .panel ul{margin:0; padding-left:18px; font-size:.85rem; color:#334155; line-height:1.65;}
  .panel ul li{margin-bottom:6px;}
  .panel ul li strong{color:#0f172a;}

  .alert{background:linear-gradient(135deg,#dc2626,#ef4444); color:#fff;
    border-radius:14px; padding:20px 24px; margin-top:14px;
    box-shadow:0 4px 16px rgba(220,38,38,.3); display:flex; gap:16px; align-items:center;}
  .alert .icon{font-size:2.4rem; flex-shrink:0;}
  .alert h3{margin:0 0 4px; font-size:1.05rem; font-weight:800;}
  .alert p{margin:0; font-size:.88rem; line-height:1.55; opacity:.95;}
  .alert strong{color:#fef3c7;}

  .quiz{background:#fff; border-radius:16px; padding:22px 24px; margin-top:14px;
    box-shadow:0 1px 3px rgba(15,23,42,.04), 0 4px 14px rgba(15,23,42,.05);
    border:1px solid var(--line);}
  .quiz h3{margin:0 0 16px; font-size:1rem; font-weight:800;
    display:flex; align-items:center; gap:8px;}
  .quiz-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media(max-width:900px){.quiz-grid{grid-template-columns:1fr;}}
  .q{background:#f8fafc; border-radius:11px; padding:16px 18px; border:1px solid var(--line);}
  .q p{margin:0 0 12px; font-weight:700; font-size:.88rem; line-height:1.5;}
  .opts{display:flex; flex-direction:column; gap:6px; margin-bottom:8px;}
  .opt{border:1.5px solid var(--line); background:#fff; padding:9px 14px;
    border-radius:8px; font-size:.82rem; cursor:pointer; transition:all .15s ease;
    font-weight:600; color:var(--ink); font-family:inherit; text-align:left;}
  .opt:hover{border-color:#94a3b8;}
  .opt.correct{background:#dcfce7; border-color:#16a34a; color:#166534;}
  .opt.wrong{background:#fee2e2; border-color:#ef4444; color:#991b1b;}
  .explain{display:none; background:#fff; border-left:4px solid #94a3b8;
    padding:10px 14px; border-radius:0 8px 8px 0; font-size:.78rem;
    color:#334155; line-height:1.55; margin-top:6px;}
  .explain.show{display:block;}
  .explain.correct-explain{border-left-color:#16a34a; background:#f0fdf4;}
  .explain.wrong-explain{border-left-color:#ef4444; background:#fef2f2;}
  .explain strong.correct{color:#166534;}
  .explain strong.wrong{color:#991b1b;}

  .footer{margin-top:16px; padding:16px 22px; background:#0f172a;
    border-radius:14px; color:#94a3b8; text-align:center; font-size:.78rem; line-height:1.6;}
  .footer strong{color:#60a5fa;}

  @keyframes flowDash{0%{stroke-dashoffset:0;}100%{stroke-dashoffset:-30;}}
  @keyframes pulse{0%,100%{opacity:1; transform:scale(1);}50%{opacity:.6; transform:scale(1.08);}}
  .flow-anim{stroke-dasharray:8 6; animation:flowDash 1.4s linear infinite;}
  .pulse-node{animation:pulse 1.8s ease-in-out infinite; transform-origin:center;}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <h1 id="pageTitle"></h1>
      <p id="pageSubtitle"></p>
    </div>
    <div class="badge" id="pageBadge"></div>
  </header>

  <div class="case-strip">
    <div>
      <h2 id="caseTitle"></h2>
      <p id="caseDescription"></p>
    </div>
    <div class="labs" id="labChips"></div>
  </div>

  <div class="tabs" id="tabs"></div>

  <section class="stage">
    <svg class="diagram" viewBox="0 0 1200 780" preserveAspectRatio="xMidYMid meet" xmlns="https://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="g1" cx="50%" cy="50%" r="55%">
          <stop offset="0%" stop-color="#fecaca"/><stop offset="100%" stop-color="#dc2626"/>
        </radialGradient>
        <radialGradient id="g2" cx="50%" cy="50%" r="55%">
          <stop offset="0%" stop-color="#ede9fe"/><stop offset="100%" stop-color="#7c3aed"/>
        </radialGradient>
        <radialGradient id="g3" cx="50%" cy="50%" r="55%">
          <stop offset="0%" stop-color="#cffafe"/><stop offset="100%" stop-color="#0891b2"/>
        </radialGradient>
        <radialGradient id="g4" cx="50%" cy="50%" r="55%">
          <stop offset="0%" stop-color="#fef9c3"/><stop offset="100%" stop-color="#ca8a04"/>
        </radialGradient>
        <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 0 L 10 5 L 0 10 Z" fill="#94a3b8"/>
        </marker>
        <marker id="arrow1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 0 L 10 5 L 0 10 Z" fill="#dc2626"/>
        </marker>
        <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed"/>
        </marker>
        <marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 0 L 10 5 L 0 10 Z" fill="#0891b2"/>
        </marker>
        <marker id="arrow4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 0 L 10 5 L 0 10 Z" fill="#ca8a04"/>
        </marker>
      </defs>

      <rect width="1200" height="780" fill="#fdfdfd"/>

      <text id="svg-title" x="600" y="35" text-anchor="middle" font-family="Arial" font-size="16" font-weight="800" fill="#0f172a"></text>
      <text id="svg-subtitle" x="600" y="58" text-anchor="middle" font-family="Arial" font-size="12" fill="#64748b"></text>

      <!-- ============ DIAGRAM 1 — HAGMA + NAGMA ============ -->
      <g id="diagram-opt1">
        <g transform="translate(140, 380)">
          <ellipse rx="95" ry="75" fill="#fecaca" stroke="#dc2626" stroke-width="3"/>
          <text x="0" y="-20" text-anchor="middle" font-family="Arial" font-size="12" font-weight="800" fill="#7f1d1d">SEPTIC</text>
          <text x="0" y="0" text-anchor="middle" font-family="Arial" font-size="12" font-weight="800" fill="#7f1d1d">SHOCK</text>
          <text x="0" y="22" text-anchor="middle" font-family="Arial" font-size="10" fill="#7f1d1d">Lactate 6.5</text>
        </g>
        <path d="M 240 380 L 310 380" stroke="#dc2626" stroke-width="3" fill="none" marker-end="url(#arrow1)"/>
        <g transform="translate(410, 380)">
          <circle r="75" fill="url(#g1)" stroke="#7f1d1d" stroke-width="3" class="pulse-node"/>
          <text x="0" y="-10" text-anchor="middle" font-family="Arial" font-size="12" font-weight="800" fill="#fff">HAGMA</text>
          <text x="0" y="12" text-anchor="middle" font-family="Arial" font-size="11" fill="#fee2e2">AG 20 (↑8)</text>
        </g>
        <path d="M 490 380 L 575 380" stroke="#dc2626" stroke-width="3" fill="none" marker-end="url(#arrow1)"/>
        <g transform="translate(680, 380)">
          <rect x="-95" y="-75" width="190" height="150" rx="14" fill="#fecaca" stroke="#7f1d1d" stroke-width="3"/>
          <text x="0" y="-40" text-anchor="middle" font-family="Arial" font-size="12" font-weight="800" fill="#7f1d1d">DELTA RATIO</text>
          <text x="0" y="-12" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#dc2626">0.57</text>
          <text x="0" y="15" text-anchor="middle" font-family="Arial" font-size="11" fill="#7f1d1d">ΔAG 8 / ΔHCO₃ 14</text>
          <text x="0" y="40" text-anchor="middle" font-family="Arial" font-size="11" font-weight="800" fill="#dc2626">0.4–1.0 = MIXED</text>
        </g>
        <path d="M 780 380 L 860 380" stroke="#dc2626" stroke-width="3" fill="none" marker-end="url(#arrow1)"/>
        <g transform="translate(985, 380)">
          <rect x="-110" y="-75" width="220" height="150" rx="14" fill="#dc2626" stroke="#7f1d1d" stroke-width="3"/>
          <text x="0" y="-35" text-anchor="middle" font-family="Arial" font-size="14" font-weight="800" fill="#fff">MIXED DISORDER</text>
          <text x="0" y="-10" text-anchor="middle" font-family="Arial" font-size="11" fill="#fee2e2">HAGMA + NAGMA</text>
          <text x="0" y="14" text-anchor="middle" font-family="Arial" font-size="11" fill="#fee2e2">Lactate + Diarrhea</text>
          <text x="0" y="38" text-anchor="middle" font-family="Arial" font-size="11" font-weight="800" fill="#fef3c7">PCO₂ 23 = appropriate</text>
          <text x="0" y="58" text-anchor="middle" font-family="Arial" font-size="11" fill="#fee2e2">No resp. disorder</text>
        </g>
        <text x="600" y="540" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#7f1d1d">Delta ratio 0.4–1.0 = mixed HAGMA + NAGMA</text>
      </g>

      <!-- ============ DIAGRAM 2 — PURE HAGMA ============ -->
      <g id="diagram-opt2" style="display:none">
        <g transform="translate(140, 380)">
          <ellipse rx="95" ry="75" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
          <text x="0" y="-20" text-anchor="middle" font-family="Arial" font-size="11" font-weight="800" fill="#5b21b6">LACTIC</text>
          <text x="0" y="0" text-anchor="middle" font-family="Arial" font-size="11" font-weight="800" fill="#5b21b6">ACIDOSIS</text>
          <text x="0" y="22" text-anchor="middle" font-family="Arial" font-size="10" fill="#5b21b6">Lactate 6.5</text>
        </g>
        <path d="M 240 380 L 310 380" stroke="#7c3aed" stroke-width="3" fill="none" marker-end="url(#arrow2)"/>
        <g transform="translate(410, 380)">
          <circle r="75" fill="url(#g2)" stroke="#5b21b6" stroke-width="3" class="pulse-node"/>
          <text x="0" y="-10" text-anchor="middle" font-family="Arial" font-size="12" font-weight="800" fill="#fff">HAGMA</text>
          <text x="0" y="12" text-anchor="middle" font-family="Arial" font-size="11" fill="#ede9fe">AG 20 (↑8)</text>
        </g>
        <path d="M 490 380 L 575 380" stroke="#7c3aed" stroke-width="3" fill="none" marker-end="url(#arrow2)"/>
        <g transform="translate(680, 380)">
          <rect x="-95" y="-75" width="190" height="150" rx="14" fill="#ede9fe" stroke="#5b21b6" stroke-width="3"/>
          <text x="0" y="-40" text-anchor="middle" font-family="Arial" font-size="12" font-weight="800" fill="#5b21b6">DELTA RATIO</text>
          <text x="0" y="-12" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#7c3aed">1.0–2.0</text>
          <text x="0" y="15" text-anchor="middle" font-family="Arial" font-size="11" fill="#5b21b6">Pure HAGMA</text>
          <text x="0" y="40" text-anchor="middle" font-family="Arial" font-size="11" font-weight="800" fill="#7c3aed">Not seen here</text>
        </g>
        <path d="M 780 380 L 860 380" stroke="#7c3aed" stroke-width="3" fill="none" marker-end="url(#arrow2)"/>
        <g transform="translate(985, 380)">
          <rect x="-110" y="-75" width="220" height="150" rx="14" fill="#7c3aed" stroke="#5b21b6" stroke-width="3"/>
          <text x="0" y="-35" text-anchor="middle" font-family="Arial" font-size="14" font-weight="800" fill="#fff">PURE HAGMA</text>
          <text x="0" y="-10" text-anchor="middle" font-family="Arial" font-size="11" fill="#ede9fe">ΔAG ≈ ΔHCO₃</text>
          <text x="0" y="14" text-anchor="middle" font-family="Arial" font-size="11" fill="#ede9fe">No NAGMA component</text>
          <text x="0" y="38" text-anchor="middle" font-family="Arial" font-size="11" font-weight="800" fill="#fef3c7">Would be 1:1</text>
        </g>
        <text x="600" y="540" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#5b21b6">Pure HAGMA: delta ratio 1.0–2.0 · Not this case (ratio 0.57)</text>
      </g>

      <!-- ============ DIAGRAM 3 — PURE NAGMA ============ -->
      <g id="diagram-opt3" style="display:none">
        <g transform="translate(140, 380)">
          <ellipse rx="95" ry="75" fill="#cffafe" stroke="#0891b2" stroke-width="3"/>
          <text x="0" y="-20" text-anchor="middle" font-family="Arial" font-size="11" font-weight="800" fill="#155e75">DIARRHEA</text>
          <text x="0" y="2" text-anchor="middle" font-family="Arial" font-size="11" font-weight="800" fill="#155e75">HCO₃⁻ LOSS</text>
          <text x="0" y="24" text-anchor="middle" font-family="Arial" font-size="10" fill="#155e75">Cl⁻ 110</text>
        </g>
        <path d="M 240 380 L 310 380" stroke="#0891b2" stroke-width="3" fill="none" marker-end="url(#arrow3)"/>
        <g transform="translate(410, 380)">
          <circle r="75" fill="url(#g3)" stroke="#155e75" stroke-width="3" class="pulse-node"/>
          <text x="0" y="-10" text-anchor="middle" font-family="Arial" font-size="12" font-weight="800" fill="#fff">NAGMA</text>
          <text x="0" y="12" text-anchor="middle" font-family="Arial" font-size="11" fill="#cffafe">AG normal</text>
        </g>
        <path d="M 490 380 L 575 380" stroke="#0891b2" stroke-width="3" fill="none" marker-end="url(#arrow3)"/>
        <g transform="translate(680, 380)">
          <rect x="-95" y="-75" width="190" height="150" rx="14" fill="#cffafe" stroke="#0891b2" stroke-width="3"/>
          <text x="0" y="-40" text-anchor="middle" font-family="Arial" font-size="12" font-weight="800" fill="#155e75">DELTA RATIO</text>
          <text x="0" y="-12" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#0891b2">&lt; 0.4</text>
          <text x="0" y="15" text-anchor="middle" font-family="Arial" font-size="11" fill="#155e75">Pure NAGMA</text>
          <text x="0" y="40" text-anchor="middle" font-family="Arial" font-size="11" font-weight="800" fill="#0891b2">Not this case</text>
        </g>
        <path d="M 780 380 L 860 380" stroke="#0891b2" stroke-width="3" fill="none" marker-end="url(#arrow3)"/>
        <g transform="translate(985, 380)">
          <rect x="-110" y="-75" width="220" height="150" rx="14" fill="#0891b2" stroke="#155e75" stroke-width="3"/>
          <text x="0" y="-35" text-anchor="middle" font-family="Arial" font-size="14" font-weight="800" fill="#fff">PURE NAGMA</text>
          <text x="0" y="-10" text-anchor="middle" font-family="Arial" font-size="11" fill="#cffafe">ΔAG ≈ 0</text>
          <text x="0" y="14" text-anchor="middle" font-family="Arial" font-size="11" fill="#cffafe">Only HCO₃⁻ loss</text>
          <text x="0" y="38" text-anchor="middle" font-family="Arial" font-size="11" font-weight="800" fill="#fef3c7">Would be &lt; 0.4</text>
        </g>
        <text x="600" y="540" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#155e75">Pure NAGMA: delta ratio &lt; 0.4 · Not this case (ratio 0.57)</text>
      </g>

      <!-- ============ DIAGRAM 4 — HAGMA + METABOLIC ALKALOSIS ============ -->
      <g id="diagram-opt4" style="display:none">
        <g transform="translate(140, 380)">
          <ellipse rx="95" ry="75" fill="#fef9c3" stroke="#ca8a04" stroke-width="3"/>
          <text x="0" y="-20" text-anchor="middle" font-family="Arial" font-size="11" font-weight="800" fill="#713f12">VOMITING</text>
          <text x="0" y="2" text-anchor="middle" font-family="Arial" font-size="11" font-weight="800" fill="#713f12">ALKALOSIS</text>
          <text x="0" y="24" text-anchor="middle" font-family="Arial" font-size="10" fill="#713f12">H⁺ loss</text>
        </g>
        <path d="M 240 380 L 310 380" stroke="#ca8a04" stroke-width="3" fill="none" marker-end="url(#arrow4)"/>
        <g transform="translate(410, 380)">
          <circle r="75" fill="url(#g4)" stroke="#713f12" stroke-width="3" class="pulse-node"/>
          <text x="0" y="-10" text-anchor="middle" font-family="Arial" font-size="12" font-weight="800" fill="#fff">ALKALOSIS</text>
          <text x="0" y="12" text-anchor="middle" font-family="Arial" font-size="11" fill="#fef9c3">HCO₃⁻ ↑</text>
        </g>
        <path d="M 490 380 L 575 380" stroke="#ca8a04" stroke-width="3" fill="none" marker-end="url(#arrow4)"/>

  ["opt1", "opt2", "opt3", "opt4"].forEach(id => {

  });
  document.getElementById("diagram-" + mode).style.display = "block";
