<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peritoneal Dialysis — Low Transporter, Dwell Time & Prescription</title>
<style>
  :root{ --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --bg:#f1f5f9;
    --opt1:#dc2626; --opt2:#7c3aed; --opt3:#0891b2; --opt4:#ca8a04; }
  *{box-sizing:border-box;}
  body{margin:0; font-family:"Inter","Segoe UI",system-ui,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.5; font-size:16px;}
  .wrap{max-width:1300px;margin:0 auto;padding:20px 18px 40px;}

  header.top{display:flex; flex-wrap:wrap; gap:12px; align-items:center;
    justify-content:space-between; margin-bottom:14px;
    animation:slideDown .6s cubic-bezier(.4,0,.2,1);}
  header.top h1{margin:0; font-size:1.35rem; font-weight:800;}
  header.top p{margin:2px 0 0; font-size:.82rem; color:var(--muted);}
  .badge{background:#0f172a; color:#fff; font-size:.72rem; padding:7px 14px;
    border-radius:999px; letter-spacing:.06em; font-weight:700;}

  .case-strip{background:#fff; border-radius:14px; padding:16px 20px;
    border:1px solid var(--line); border-left:5px solid var(--opt1);
    box-shadow:0 1px 3px rgba(15,23,42,.04); margin-bottom:14px;
    display:flex; flex-wrap:wrap; gap:16px; align-items:center;
    animation:slideDown .7s cubic-bezier(.4,0,.2,1);}
  .case-strip h2{margin:0 0 4px; font-size:1rem; font-weight:800; color:#991b1b;}
  .case-strip p{margin:0; font-size:.85rem; color:#334155; line-height:1.55;}
  .labs{display:flex; gap:8px; flex-wrap:wrap;}
  .lab-chip{background:#f1f5f9; border-radius:9px; padding:6px 12px;
    font-size:.75rem; font-weight:700; color:#1e293b; border:1px solid var(--line);
    font-family:"JetBrains Mono",monospace;}
  .lab-chip.abn{background:#fef2f2; border-color:#fecaca; color:#991b1b;}
  .lab-chip.pos{background:#dcfce7; border-color:#bbf7d0; color:#166534;}

  .tabs{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;}
  .tab{background:#fff; border:1.5px solid transparent; padding:10px 18px;
    border-radius:10px; font-size:.85rem; font-weight:700; cursor:pointer;
    transition:all .18s ease; color:var(--muted); font-family:inherit;}
  .tab:hover{border-color:#cbd5e1; transform:translateY(-1px);}
  .tab.opt1.active{background:#fef2f2; border-color:var(--opt1); color:#991b1b;}
  .tab.opt2.active{background:#f5f3ff; border-color:var(--opt2); color:#5b21b6;}
  .tab.opt3.active{background:#cffafe; border-color:var(--opt3); color:#155e75;}
  .tab.opt4.active{background:#fef9c3; border-color:var(--opt4); color:#713f12;}

  .stage{background:#fff; border-radius:16px; padding:12px;
    box-shadow:0 1px 3px rgba(15,23,42,.04), 0 4px 14px rgba(15,23,42,.05);
    border:1px solid var(--line); position:relative;
    animation:slideDown .8s cubic-bezier(.4,0,.2,1);}
  svg.diagram{width:100%; height:auto; display:block;}

  .info-float{position:absolute; top:80px; right:20px;
    background:rgba(255,255,255,.97); backdrop-filter:blur(6px);
    border-radius:12px; padding:0; border:1px solid var(--line);
    box-shadow:0 4px 16px rgba(15,23,42,.1); width:280px;
    max-width:calc(100% - 40px); transition:all .3s cubic-bezier(.4,0,.2,1);
    overflow:hidden; z-index:10;}
  .info-float.highlight-opt1{border-color:var(--opt1);}
  .info-float.highlight-opt2{border-color:var(--opt2);}
  .info-float.highlight-opt3{border-color:var(--opt3);}
  .info-float.highlight-opt4{border-color:var(--opt4);}
  .info-header{display:flex; justify-content:space-between; align-items:center;
    padding:12px 14px; cursor:pointer; user-select:none;
    background:#fef2f2; transition:all .2s ease;}
  .info-float.highlight-opt2 .info-header{background:#f5f3ff;}
  .info-float.highlight-opt3 .info-header{background:#cffafe;}
  .info-float.highlight-opt4 .info-header{background:#fef9c3;}
  .info-header h4{margin:0; font-size:.82rem; font-weight:800;
    color:#0f172a; display:flex; align-items:center; gap:6px;}
  .info-header .toggle-btn{font-size:.72rem; color:var(--muted);
    background:rgba(0,0,0,.06); padding:3px 8px; border-radius:999px; font-weight:700;}
  .info-body{padding:12px 14px 14px; max-height:500px;
    transition:all .3s cubic-bezier(.4,0,.2,1); overflow:hidden;}
  .info-float.collapsed .info-body{max-height:0; padding:0 14px;}
  .info-float .row{display:flex; justify-content:space-between;
    padding:8px 0; font-size:.78rem; border-bottom:1px solid var(--line);}
  .info-float .row:last-child{border:none;}
  .info-float .k{color:var(--muted); font-weight:600; flex-shrink:0;}
  .info-float .v{font-weight:800; color:#0f172a; text-align:right;
    word-break:break-word; max-width:165px; line-height:1.35;}

  .panels{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px;}
  @media(max-width:800px){.panels{grid-template-columns:1fr;}}
  .panel{background:#fff; border-radius:14px; padding:18px 20px;
    box-shadow:0 1px 3px rgba(15,23,42,.04), 0 4px 14px rgba(15,23,42,.05);
    border:1px solid var(--line); border-top:4px solid var(--opt1);
    animation:slideDown .9s cubic-bezier(.4,0,.2,1);}
  .panel.two{border-top-color:#475569; animation-delay:.1s;}
  .panel h3{margin:0 0 4px; font-size:1rem; font-weight:800;
    display:flex; align-items:center; gap:8px;}
  .panel .tagline{font-size:.78rem; color:var(--muted); margin:0 0 12px;}
  .panel ul{margin:0; padding-left:18px; font-size:.85rem; color:#334155; line-height:1.65;}
  .panel ul li{margin-bottom:6px;}
  .panel ul li strong{color:#0f172a;}

  .alert{background:linear-gradient(135deg,#dc2626,#ef4444); color:#fff;
    border-radius:14px; padding:20px 24px; margin-top:14px;
    box-shadow:0 4px 16px rgba(220,38,38,.3); display:flex; gap:16px; align-items:center;
    animation:slideDown 1s cubic-bezier(.4,0,.2,1);}
  .alert .icon{font-size:2.4rem; flex-shrink:0;}
  .alert h3{margin:0 0 4px; font-size:1.05rem; font-weight:800;}
  .alert p{margin:0; font-size:.88rem; line-height:1.55; opacity:.95;}
  .alert strong{color:#fef3c7;}

  .quiz{background:#fff; border-radius:16px; padding:22px 24px; margin-top:14px;
    box-shadow:0 1px 3px rgba(15,23,42,.04), 0 4px 14px rgba(15,23,42,.05);
    border:1px solid var(--line);
    animation:slideDown 1.1s cubic-bezier(.4,0,.2,1);}
  .quiz h3{margin:0 0 16px; font-size:1rem; font-weight:800;
    display:flex; align-items:center; gap:8px;}
  .quiz-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media(max-width:900px){.quiz-grid{grid-template-columns:1fr;}}
  .q{background:#f8fafc; border-radius:11px; padding:16px 18px; border:1px solid var(--line);
    animation:cardFadeIn .45s cubic-bezier(.4,0,.2,1) backwards;
    transition:transform .2s ease, box-shadow .2s ease;}
  .q:hover{transform:translateY(-2px); box-shadow:0 4px 12px rgba(15,23,42,.06);}
  .q p{margin:0 0 12px; font-weight:700; font-size:.88rem; line-height:1.5;}
  .opts{display:flex; flex-direction:column; gap:6px; margin-bottom:8px;}
  .opt{border:1.5px solid var(--line); background:#fff; padding:9px 14px;
    border-radius:8px; font-size:.82rem; cursor:pointer;
    transition:all .18s ease; font-weight:600; color:var(--ink);
    font-family:inherit; text-align:left;}
  .opt:hover{border-color:#94a3b8; transform:translateX(3px);}
  .opt.correct{background:#dcfce7; border-color:#16a34a; color:#166534;
    animation:correctPop .4s cubic-bezier(.34,1.56,.64,1);}
  .opt.wrong{background:#fee2e2; border-color:#ef4444; color:#991b1b;
    animation:shake .4s cubic-bezier(.36,.07,.19,.97);}
  .explain{display:none; background:#fff; border-left:4px solid #94a3b8;
    padding:10px 14px; border-radius:0 8px 8px 0; font-size:.78rem;
    color:#334155; line-height:1.55; margin-top:6px;}
  .explain.show{display:block; animation:boxSlide .35s cubic-bezier(.4,0,.2,1);}
  .explain.correct-explain{border-left-color:#16a34a; background:#f0fdf4;}
  .explain.wrong-explain{border-left-color:#ef4444; background:#fef2f2;}
  .explain strong.correct{color:#166534;}
  .explain strong.wrong{color:#991b1b;}

  .footer{margin-top:16px; padding:16px 22px; background:#0f172a;
    border-radius:14px; color:#94a3b8; text-align:center; font-size:.78rem; line-height:1.6;}
  .footer strong{color:#60a5fa;}

  @keyframes slideDown{
    0%{opacity:0; transform:translateY(-16px);}
    100%{opacity:1; transform:translateY(0);}
  }
  @keyframes cardFadeIn{
    0%{opacity:0; transform:translateY(12px) scale(.97);}
    100%{opacity:1; transform:translateY(0) scale(1);}
  }
  @keyframes boxSlide{
    0%{opacity:0; transform:translateX(-14px);}
    100%{opacity:1; transform:translateX(0);}
  }
  @keyframes correctPop{
    0%{transform:scale(1);}
    50%{transform:scale(1.04);}
    100%{transform:scale(1);}
  }
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-6px);}
    40%{transform:translateX(6px);}
    60%{transform:translateX(-4px);}
    80%{transform:translateX(4px);}
  }
  @keyframes flowDash{0%{stroke-dashoffset:0;}100%{stroke-dashoffset:-30;}}
  @keyframes pulse{0%,100%{opacity:1; transform:scale(1);}50%{opacity:.6; transform:scale(1.08);}}
  .flow-anim{stroke-dasharray:8 6; animation:flowDash 1.4s linear infinite;}
  .pulse-node{animation:pulse 1.8s ease-in-out infinite; transform-origin:center;}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <h1 id="pageTitle"></h1>
      <p id="pageSubtitle"></p>
    </div>
    <div class="badge" id="pageBadge"></div>
  </header>

  <div class="case-strip">
    <div>
      <h2 id="caseTitle"></h2>
      <p id="caseDescription"></p>
    </div>
    <div class="labs" id="labChips"></div>
  </div>

  <div class="tabs" id="tabs"></div>

  <section class="stage">
    <svg class="diagram" viewBox="0 0 1200 780" preserveAspectRatio="xMidYMid meet" xmlns="https://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="g1" cx="50%" cy="50%" r="55%">
          <stop offset="0%" stop-color="#fecaca"/><stop offset="100%" stop-color="#dc2626"/>
        </radialGradient>
        <radialGradient id="g2" cx="50%" cy="50%" r="55%">
          <stop offset="0%" stop-color="#ede9fe"/><stop offset="100%" stop-color="#7c3aed"/>
        </radialGradient>
        <radialGradient id="g3" cx="50%" cy="50%" r="55%">
          <stop offset="0%" stop-color="#cffafe"/><stop offset="100%" stop-color="#0891b2"/>
        </radialGradient>
        <radialGradient id="g4" cx="50%" cy="50%" r="55%">
          <stop offset="0%" stop-color="#fef9c3"/><stop offset="100%" stop-color="#ca8a04"/>
        </radialGradient>
        <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 0 L 10 5 L 0 10 Z" fill="#94a3b8"/>
        </marker>
        <marker id="arrow1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 0 L 10 5 L 0 10 Z" fill="#dc2626"/>
        </marker>
        <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed"/>
        </marker>
        <marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 0 L 10 5 L 0 10 Z" fill="#0891b2"/>
        </marker>
        <marker id="arrow4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 0 L 10 5 L 0 10 Z" fill="#ca8a04"/>
        </marker>
      </defs>

      <rect width="1200" height="780" fill="#fdfdfd"/>

      <text id="svg-title" x="600" y="35" text-anchor="middle" font-family="Arial" font-size="16" font-weight="800" fill="#0f172a"></text>
      <text id="svg-subtitle" x="600" y="58" text-anchor="middle" font-family="Arial" font-size="12" fill="#64748b"></text>

      <!-- ============ DIAGRAM 1 — LOW TRANSPORTER ============ -->
      <g id="diagram-opt1">
        <text x="600" y="110" text-anchor="middle" font-family="Arial" font-size="14" font-weight="800" fill="#7f1d1d">LOW TRANSPORTER — SLOW SOLUTE MOVEMENT, PRESERVED UF</text>

        <g transform="translate(180, 300)">
          <rect x="-120" y="-100" width="240" height="200" rx="14" fill="#fecaca" stroke="#dc2626" stroke-width="3"/>
          <text x="0" y="-72" text-anchor="middle" font-family="Arial" font-size="12" font-weight="800" fill="#7f1d1d">BLOOD SIDE</text>
          <text x="0" y="-25" text-anchor="middle" font-family="Arial" font-size="30">🩸</text>
          <text x="0" y="15" text-anchor="middle" font-family="Arial" font-size="11" fill="#7f1d1d">Urea, creatinine, K⁺</text>
          <text x="0" y="38" text-anchor="middle" font-family="Arial" font-size="11" fill="#7f1d1d">Phosphate</text>
        </g>

        <path d="M 305 300 L 385 300" stroke="#dc2626" stroke-width="3" fill="none" marker-end="url(#arrow1)" class="flow-anim"/>
        <text x="345" y="285" text-anchor="middle" font-family="Arial" font-size="10" font-weight="800" fill="#dc2626">slow</text>

        <g transform="translate(540, 300)">
          <rect x="-105" y="-100" width="210" height="200" rx="14" fill="#fecaca" stroke="#dc2626" stroke-width="3" class="pulse-node"/>
          <text x="0" y="-72" text-anchor="middle" font-family="Arial" font-size="12" font-weight="800" fill="#7f1d1d">PERITONEUM</text>
          <text x="0" y="-22" text-anchor="middle" font-family="Arial" font-size="30">🚪</text>
          <text x="0" y="14" text-anchor="middle" font-family="Arial" font-size="11" fill="#7f1d1d">Slow doorway</text>
          <text x="0" y="38" text-anchor="middle" font-family="Arial" font-size="11" font-weight="800" fill="#dc2626">D/P Cr 0.42</text>
        </g>

        <path d="M 650 300 L 730 300" stroke="#dc2626" stroke-width="3" fill="none" marker-end="url(#arrow1)" class="flow-anim"/>
        <text x="690" y="285" text-anchor="middle" font-family="Arial" font-size="10" font-weight="800" fill="#dc2626">slow</text>

        <g transform="translate(890, 300)">
          <rect x="-120" y="-100" width="240" height="200" rx="14" fill="#fecaca" stroke="#dc2626" stroke-width="3"/>
          <text x="0" y="-72" text-anchor="middle" font-family="Arial" font-size="12" font-weight="800" fill="#7f1d1d">DIALYSATE</text>
          <text x="0" y="-25" text-anchor="middle" font-family="Arial" font-size="30">💧</text>
          <text x="0" y="15" text-anchor="middle" font-family="Arial" font-size="11" fill="#7f1d1d">Solute arrives</text>
          <text x="0" y="38" text-anchor="middle" font-family="Arial" font-size="11" fill="#7f1d1d">only with time</text>
        </g>

        <g transform="translate(600, 540)">
          <rect x="-360" y="-60" width="720" height="120" rx="16" fill="#dc2626" stroke="#7f1d1d" stroke-width="3"/>
          <text x="0" y="-28" text-anchor="middle" font-family="Arial" font-size="14" font-weight="800" fill="#fff">LOW TRANSPORTER = SLOW EQUILIBRATION</text>
          <text x="0" y="2" text-anchor="middle" font-family="Arial" font-size="12" fill="#fee2e2">D/P Cr 0.42 · D/D₀ glucose 0.62 · Net UF 850 mL (preserved)</text>
          <text x="0" y="30" text-anchor="middle" font-family="Arial" font-size="13" font-weight="800" fill="#fef3c7">→ Long dwells needed for solute clearance</text>
        </g>
        <text x="600" y="650" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#7f1d1d">Slow solutes need more TIME to cross — short dwells = poor clearance</text>
      </g>

      <!-- ============ DIAGRAM 2 — LONGER DWELL ============ -->
      <g id="diagram-opt2" style="display:none">
        <g transform="translate(200, 260)">
          <rect x="-125" y="-80" width="250" height="160" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
          <text x="0" y="-46" text-anchor="middle" font-family="Arial" font-size="12" font-weight="800" fill="#5b21b6">SHORT DWELL</text>
          <text x="0" y="-10" text-anchor="middle" font-family="Arial" font-size="26">⏱️</text>
          <text x="0" y="22" text-anchor="middle" font-family="Arial" font-size="12" fill="#5b21b6">30 min</text>
          <text x="0" y="46" text-anchor="middle" font-family="Arial" font-size="12" font-weight="800" fill="#7c3aed">↓ clearance</text>
        </g>

        <path d="M 330 260 L 410 260" stroke="#7c3aed" stroke-width="3" fill="none" marker-end="url(#arrow2)"/>
        <text x="370" y="245" text-anchor="middle" font-family="Arial" font-size="11" font-weight="800" fill="#7c3aed">vs</text>

        <g transform="translate(590, 260)">
          <rect x="-145" y="-80" width="290" height="160" rx="14" fill="#7c3aed" stroke="#5b21b6" stroke-width="3" class="pulse-node"/>
          <text x="0" y="-46" text-anchor="middle" font-family="Arial" font-size="12" font-weight="800" fill="#fff">LONG DWELL</text>
          <text x="0" y="-10" text-anchor="middle" font-family="Arial" font-size="26">⏱️</text>
          <text x="0" y="22" text-anchor="middle" font-family="Arial" font-size="12" fill="#ede9fe">6–8 hours</text>
          <text x="0" y="46" text-anchor="middle" font-family="Arial" font-size="12" font-weight="800" fill="#fef3c7">↑ clearance ✓</text>
        </g>

        <path d="M 740 260 L 820 260" stroke="#7c3aed" stroke-width="3" fill="none" marker-end="url(#arrow2)"/>

        <g transform="translate(1000, 260)">
          <rect x="-120" y="-80" width="240" height="160" rx="14" fill="#7c3aed" stroke="#5b21b6" stroke-width="3"/>
          <text x="0" y="-46" text-anchor="middle" font-family="Arial" font-size="12" font-weight="800" fill="#fff">RESULT</text>
          <text x="0" y="-10" text-anchor="middle" font-family="Arial" font-size="26" font-weight="800" fill="#fef3c7">↑</text>
          <text x="0" y="22" text-anchor="middle" font-family="Arial" font-size="11" fill="#ede9fe">Solute clearance</text>
          <text x="0" y="46" text-anchor="middle" font-family="Arial" font-size="11" font-weight="800" fill="#fef3c7">Answer B ✓</text>
        </g>

        <g transform="translate(600, 500)">
          <rect x="-360" y="-65" width="720" height="130" rx="16" fill="#7c3aed" stroke="#5b21b6" stroke-width="3"/>
          <text x="0" y="-32" text-anchor="middle" font-family="Arial" font-size="14" font-weight="800" fill="#fff">INCREASE DWELL DURATION</text>
          <text x="0" y="-4" text-anchor="middle" font-family="Arial" font-size="12" fill="#ede9fe">Low transporters need more time for solute equilibration</text>
          <text x="0" y="26" text-anchor="middle" font-family="Arial" font-size="13" font-weight="800" fill="#fef3c7">Longer dwells → more solute transfer per exchange</text>
        </g>
        <text x="600" y="640" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#5b21b6">For a LOW transporter, prolong the dwell — do NOT shorten it</text>
      </g>

      <!-- ============ DIAGRAM 3 — ICODEXTRIN ============ -->
      <g id="diagram-opt3" style="display:none">
        <g transform="translate(200, 260)">
          <rect x="-130" y="-100" width="260" height="200" rx="14" fill="#cffafe" stroke="#0891b2" stroke-width="3"/>
          <text x="0" y="-70" text-anchor="middle" font-family="Arial" font-size="12" font-weight="800" fill="#155e75">ICODEXTRIN</text>
          <text x="0" y="-22" text-anchor="middle" font-family="Arial" font-size="30">💧</text>
          <text x="0" y="16" text-anchor="middle" font-family="Arial" font-size="11" fill="#155e75">Colloid osmotic agent</text>
          <text x="0" y="40" text-anchor="middle" font-family="Arial" font-size="11" fill="#155e75">Long dwell (8–16 h)</text>
        </g>

        <path d="M 335 260 L 415 260" stroke="#0891b2" stroke-width="3" fill="none" marker-end="url(#arrow3)"/>

        <g transform="translate(620, 260)">
          <rect x="-140" y="-100" width="280" height="200" rx="14" fill="#cffafe" stroke="#0891b2" stroke-width="3" class="pulse-node"/>
          <text x="0" y="-70" text-anchor="middle" font-family="Arial" font-size="12" font-weight="800" fill="#155e75">PRIMARY BENEFIT</text>
          <text x="0" y="-22" text-anchor="middle" font-family="Arial" font-size="30" font-weight="800" fill="#0891b2">↑</text>
          <text x="0" y="16" text-anchor="middle" font-family="Arial" font-size="13" font-weight="800" fill="#155e75">ULTRAFILTRATION</text>
          <text x="0" y="40" text-anchor="middle" font-family="Arial" font-size="11" fill="#155e75">during long dwells</text>
        </g>

        <path d="M 765 260 L 845 260" stroke="#0891b2" stroke-width="3" fill="none" marker-end="url(#arrow3)"/>

        <g transform="translate(1020, 260)">

  const quizGrid = document.getElementById("quizGrid");
  quizGrid.innerHTML = CONFIG.quiz.map((q, qi) => `
    <div class="q" data-q="${qi}" style="animation-delay:${qi * 0.06}s">
      <p>${qi + 1}. ${q.question}</p>
      <div class="opts">
        ${q.options.map((o, oi) => `
          <button class="opt" data-q="${qi}" data-o="${oi}">${o.text}</button>
        `).join("")}
      </div>
      <div class="explain"></div>
    </div>
  `).join("");

  quizGrid.querySelectorAll(".opt").forEach(btn => {
    btn.addEventListener("click", () => {
      const qi = parseInt(btn.dataset.q, 10);
      const oi = parseInt(btn.dataset.o, 10);
      const q = CONFIG.quiz[qi];
      const opt = q.options[oi];
      const box = btn.closest(".q");

      box.querySelectorAll(".opt").forEach(b => b.classList.remove("correct", "wrong"));
      btn.classList.add(opt.correct ? "correct" : "wrong");

      const explain = box.querySelector(".explain");
      if (opt.correct) {
        explain.className = "explain show correct-explain";
        explain.innerHTML = "<strong class='correct'>✔ Correct.</strong> " + opt.explanation;
      } else {
        explain.className = "explain show wrong-explain";
        explain.innerHTML = "<strong class='wrong'>✘ Incorrect.</strong> " + opt.explanation;
      }
    });
  });

  setMode("opt1");
})();

function setMode(mode) {
  const d = CONFIG.modes[mode];
  if (!d) return;

  CONFIG.tabs.forEach(t => {
    document.getElementById("tab" + t.id).classList.remove("active");
  });
  document.getElementById("tab" + mode).classList.add("active");

  ["opt1", "opt2", "opt3", "opt4"].forEach(id => {
    document.getElementById("diagram-" + id).style.display = "none";
  });
  document.getElementById("diagram-" + mode).style.display = "block";

  document.getElementById("svg-title").textContent = d.svgTitle;
  document.getElementById("svg-subtitle").textContent = d.svgSubtitle;

  document.getElementById("banner-bg").setAttribute("fill", d.bannerBg);
  document.getElementById("banner-text-1").textContent = d.bannerText1;
  document.getElementById("banner-text-2").textContent = d.bannerText2;

  const panel = document.getElementById("infoPanel");
  panel.className = "info-float " + d.panelClass +
    (panel.classList.contains("collapsed") ? " collapsed" : "");

  document.getElementById("infoTitle").textContent = d.infoTitle;
  document.getElementById("infoBody").innerHTML = d.infoRows
    .map(r => `<div class="row"><span class="k">${r.k}</span><span class="v">${r.v}</span></div>`)
    .join("");

  document.getElementById("panel1-title").textContent = d.panel1Title;
  document.getElementById("panel1-tagline").textContent = d.panel1Tagline;
  document.getElementById("panel1-list").innerHTML = d.panel1List.map(li => `<li>${li}</li>`).join("");

  document.getElementById("panel2-title").textContent = d.panel2Title;
  document.getElementById("panel2-tagline").textContent = d.panel2Tagline;
  document.getElementById("panel2-list").innerHTML = d.panel2List.map(li => `<li>${li}</li>`).join("");

  document.getElementById("alertIcon").textContent = d.alertIcon;
  document.getElementById("alertTitle").textContent = d.alertTitle;
  document.getElementById("alertText").innerHTML = d.alertText;
}

let panelCollapsed = false;
function togglePanel() {
  panelCollapsed = !panelCollapsed;
  const panel = document.getElementById("infoPanel");
  const btn = document.getElementById("toggleBtn");
  panel.classList.toggle("collapsed", panelCollapsed);
  btn.textContent = panelCollapsed ? "▼ Show" : "▲ Hide";
}
</script>
</body>
</html>
