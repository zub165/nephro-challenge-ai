<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filtration Fraction & PD Sodium Sieving — Renal Physiology</title>
<style>
  :root{ --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --bg:#f1f5f9;
    --opt1:#dc2626; --opt2:#7c3aed; --opt3:#0891b2; --opt4:#ca8a04; }
  *{box-sizing:border-box;}
  body{margin:0; font-family:"Inter","Segoe UI",system-ui,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.5; font-size:16px;}
  .wrap{max-width:1300px;margin:0 auto;padding:20px 18px 40px;}

  header.top{display:flex; flex-wrap:wrap; gap:12px; align-items:center;
    justify-content:space-between; margin-bottom:14px;}
  header.top h1{margin:0; font-size:1.35rem; font-weight:800;}
  header.top p{margin:2px 0 0; font-size:.82rem; color:var(--muted);}
  .badge{background:#0f172a; color:#fff; font-size:.72rem; padding:7px 14px;
    border-radius:999px; letter-spacing:.06em; font-weight:700;}

  .case-strip{background:#fff; border-radius:14px; padding:16px 20px;
    border:1px solid var(--line); border-left:5px solid var(--opt1);
    box-shadow:0 1px 3px rgba(15,23,42,.04); margin-bottom:14px;
    display:flex; flex-wrap:wrap; gap:16px; align-items:center;}
  .case-strip h2{margin:0 0 4px; font-size:1rem; font-weight:800; color:#991b1b;}
  .case-strip p{margin:0; font-size:.85rem; color:#334155; line-height:1.55;}
  .labs{display:flex; gap:8px; flex-wrap:wrap;}
  .lab-chip{background:#f1f5f9; border-radius:9px; padding:6px 12px;
    font-size:.75rem; font-weight:700; color:#1e293b; border:1px solid var(--line);
    font-family:"JetBrains Mono",monospace;}
  .lab-chip.abn{background:#fef2f2; border-color:#fecaca; color:#991b1b;}
  .lab-chip.pos{background:#dcfce7; border-color:#bbf7d0; color:#166534;}

  .tab-group-label{font-size:.72rem; font-weight:800; text-transform:uppercase;
    letter-spacing:.1em; color:var(--muted); margin:0 0 6px;}

  .tabs{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;}
  .tab{background:#fff; border:1.5px solid transparent; padding:10px 18px;
    border-radius:10px; font-size:.85rem; font-weight:700; cursor:pointer;
    transition:all .15s ease; color:var(--muted); font-family:inherit;}
  .tab:hover{border-color:#cbd5e1;}
  .tab.opt1.active,.tab.opt5.active{background:#fef2f2; border-color:var(--opt1); color:#991b1b;}
  .tab.opt2.active,.tab.opt6.active{background:#f5f3ff; border-color:var(--opt2); color:#5b21b6;}
  .tab.opt3.active,.tab.opt7.active{background:#cffafe; border-color:var(--opt3); color:#155e75;}
  .tab.opt4.active,.tab.opt8.active{background:#fef9c3; border-color:var(--opt4); color:#713f12;}

  .stage{background:#fff; border-radius:16px; padding:12px;
    box-shadow:0 1px 3px rgba(15,23,42,.04), 0 4px 14px rgba(15,23,42,.05);
    border:1px solid var(--line); position:relative;}
  svg.diagram{width:100%; height:auto; display:block;}

  .info-float{position:absolute; top:80px; right:20px;
    background:rgba(255,255,255,.97); backdrop-filter:blur(6px);
    border-radius:12px; padding:0; border:1px solid var(--line);
    box-shadow:0 4px 16px rgba(15,23,42,.1); width:260px;
    max-width:calc(100% - 40px); transition:all .3s cubic-bezier(.4,0,.2,1);
    overflow:hidden; z-index:10;}
  .info-float.highlight-opt1,.info-float.highlight-opt5{border-color:var(--opt1);}
  .info-float.highlight-opt2,.info-float.highlight-opt6{border-color:var(--opt2);}
  .info-float.highlight-opt3,.info-float.highlight-opt7{border-color:var(--opt3);}
  .info-float.highlight-opt4,.info-float.highlight-opt8{border-color:var(--opt4);}
  .info-header{display:flex; justify-content:space-between; align-items:center;
    padding:12px 14px; cursor:pointer; user-select:none;
    background:#fef2f2; transition:all .2s ease;}
  .info-float.highlight-opt2 .info-header,
  .info-float.highlight-opt6 .info-header{background:#f5f3ff;}
  .info-float.highlight-opt3 .info-header,
  .info-float.highlight-opt7 .info-header{background:#cffafe;}
  .info-float.highlight-opt4 .info-header,
  .info-float.highlight-opt8 .info-header{background:#fef9c3;}
  .info-header h4{margin:0; font-size:.82rem; font-weight:800;
    color:#0f172a; display:flex; align-items:center; gap:6px;}
  .info-header .toggle-btn{font-size:.72rem; color:var(--muted);
    background:rgba(0,0,0,.06); padding:3px 8px; border-radius:999px; font-weight:700;}
  .info-body{padding:12px 14px 14px; max-height:500px;
    transition:all .3s cubic-bezier(.4,0,.2,1); overflow:hidden;}
  .info-float.collapsed .info-body{max-height:0; padding:0 14px;}
  .info-float .row{display:flex; justify-content:space-between;
    padding:8px 0; font-size:.78rem; border-bottom:1px solid var(--line);}
  .info-float .row:last-child{border:none;}
  .info-float .k{color:var(--muted); font-weight:600; flex-shrink:0;}
  .info-float .v{font-weight:800; color:#0f172a; text-align:right;
    word-break:break-word; max-width:155px; line-height:1.35;}

  .panels{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px;}
  @media(max-width:800px){.panels{grid-template-columns:1fr;}}
  .panel{background:#fff; border-radius:14px; padding:18px 20px;
    box-shadow:0 1px 3px rgba(15,23,42,.04), 0 4px 14px rgba(15,23,42,.05);
    border:1px solid var(--line); border-top:4px solid var(--opt1);}
  .panel.two{border-top-color:#475569;}
  .panel h3{margin:0 0 4px; font-size:1rem; font-weight:800;
    display:flex; align-items:center; gap:8px;}
  .panel .tagline{font-size:.78rem; color:var(--muted); margin:0 0 12px;}
  .panel ul{margin:0; padding-left:18px; font-size:.85rem; color:#334155; line-height:1.65;}
  .panel ul li{margin-bottom:6px;}
  .panel ul li strong{color:#0f172a;}

  .alert{background:linear-gradient(135deg,#dc2626,#ef4444); color:#fff;
    border-radius:14px; padding:20px 24px; margin-top:14px;
    box-shadow:0 4px 16px rgba(220,38,38,.3); display:flex; gap:16px; align-items:center;}
  .alert .icon{font-size:2.4rem; flex-shrink:0;}
  .alert h3{margin:0 0 4px; font-size:1.05rem; font-weight:800;}
  .alert p{margin:0; font-size:.88rem; line-height:1.55; opacity:.95;}
  .alert strong{color:#fef3c7;}

  .quiz{background:#fff; border-radius:16px; padding:22px 24px; margin-top:14px;
    box-shadow:0 1px 3px rgba(15,23,42,.04), 0 4px 14px rgba(15,23,42,.05);
    border:1px solid var(--line);}
  .quiz h3{margin:0 0 16px; font-size:1rem; font-weight:800;
    display:flex; align-items:center; gap:8px;}
  .quiz-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media(max-width:900px){.quiz-grid{grid-template-columns:1fr;}}
  .q{background:#f8fafc; border-radius:11px; padding:16px 18px; border:1px solid var(--line);}
  .q p{margin:0 0 12px; font-weight:700; font-size:.88rem; line-height:1.5;}
  .opts{display:flex; flex-direction:column; gap:6px; margin-bottom:8px;}
  .opt{border:1.5px solid var(--line); background:#fff; padding:9px 14px;
    border-radius:8px; font-size:.82rem; cursor:pointer; transition:all .15s ease;
    font-weight:600; color:var(--ink); font-family:inherit; text-align:left;}
  .opt:hover{border-color:#94a3b8;}
  .opt.correct{background:#dcfce7; border-color:#16a34a; color:#166534;}
  .opt.wrong{background:#fee2e2; border-color:#ef4444; color:#991b1b;}
  .explain{display:none; background:#fff; border-left:4px solid #94a3b8;
    padding:10px 14px; border-radius:0 8px 8px 0; font-size:.78rem;
    color:#334155; line-height:1.55; margin-top:6px;}
  .explain.show{display:block;}
  .explain.correct-explain{border-left-color:#16a34a; background:#f0fdf4;}
  .explain.wrong-explain{border-left-color:#ef4444; background:#fef2f2;}
  .explain strong.correct{color:#166534;}
  .explain strong.wrong{color:#991b1b;}

  .footer{margin-top:16px; padding:16px 22px; background:#0f172a;
    border-radius:14px; color:#94a3b8; text-align:center; font-size:.78rem; line-height:1.6;}
  .footer strong{color:#60a5fa;}

  @keyframes flowDash{0%{stroke-dashoffset:0;}100%{stroke-dashoffset:-30;}}
  @keyframes pulse{0%,100%{opacity:1; transform:scale(1);}50%{opacity:.6; transform:scale(1.08);}}
  .flow-anim{stroke-dasharray:8 6; animation:flowDash 1.4s linear infinite;}
  .pulse-node{animation:pulse 1.8s ease-in-out infinite; transform-origin:center;}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <h1 id="pageTitle"></h1>
      <p id="pageSubtitle"></p>
    </div>
    <div class="badge" id="pageBadge"></div>
  </header>

  <div class="case-strip">
    <div>
      <h2 id="caseTitle"></h2>
      <p id="caseDescription"></p>
    </div>
    <div class="labs" id="labChips"></div>
  </div>

  <p class="tab-group-label" id="groupLabelA">Topic A — Filtration Fraction (Native Kidney &amp; CRRT)</p>
  <div class="tabs" id="tabsA"></div>

  <p class="tab-group-label" id="groupLabelB">Topic B — Peritoneal Dialysis: Sodium Sieving &amp; Ultrafiltration Failure</p>
  <div class="tabs" id="tabsB"></div>

  <section class="stage">
    <svg class="diagram" viewBox="0 0 1200 780" preserveAspectRatio="xMidYMid meet" xmlns="https://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="g1" cx="50%" cy="50%" r="55%">
          <stop offset="0%" stop-color="#fecaca"/><stop offset="100%" stop-color="#dc2626"/>
        </radialGradient>
        <radialGradient id="g2" cx="50%" cy="50%" r="55%">
          <stop offset="0%" stop-color="#ede9fe"/><stop offset="100%" stop-color="#7c3aed"/>
        </radialGradient>
        <radialGradient id="g3" cx="50%" cy="50%" r="55%">
          <stop offset="0%" stop-color="#cffafe"/><stop offset="100%" stop-color="#0891b2"/>
        </radialGradient>
        <radialGradient id="g4" cx="50%" cy="50%" r="55%">
          <stop offset="0%" stop-color="#fef9c3"/><stop offset="100%" stop-color="#ca8a04"/>
        </radialGradient>
        <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 0 L 10 5 L 0 10 Z" fill="#94a3b8"/>
        </marker>
        <marker id="arrow1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 0 L 10 5 L 0 10 Z" fill="#dc2626"/>
        </marker>
        <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed"/>
        </marker>
        <marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 0 L 10 5 L 0 10 Z" fill="#0891b2"/>
        </marker>
        <marker id="arrow4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 0 L 10 5 L 0 10 Z" fill="#ca8a04"/>
        </marker>
      </defs>

      <rect width="1200" height="780" fill="#fdfdfd"/>

      <text id="svg-title" x="600" y="35" text-anchor="middle" font-family="Arial" font-size="16" font-weight="800" fill="#0f172a"></text>
      <text id="svg-subtitle" x="600" y="58" text-anchor="middle" font-family="Arial" font-size="12" fill="#64748b"></text>

      <!-- ==================== TOPIC A ==================== -->

      <!-- A1 — NATIVE KIDNEY FF -->
      <g id="diagram-opt1">
        <g transform="translate(180, 380)">
          <ellipse rx="105" ry="75" fill="#fecaca" stroke="#dc2626" stroke-width="3"/>
          <text x="0" y="-22" text-anchor="middle" font-family="Arial" font-size="13" font-weight="800" fill="#7f1d1d">GFR</text>
          <text x="0" y="6" text-anchor="middle" font-family="Arial" font-size="24" font-weight="800" fill="#7f1d1d">120</text>
          <text x="0" y="30" text-anchor="middle" font-family="Arial" font-size="11" fill="#7f1d1d">mL/min</text>
        </g>
        <path d="M 295 380 L 375 380" stroke="#dc2626" stroke-width="3" fill="none" marker-end="url(#arrow1)"/>
        <text x="335" y="364" text-anchor="middle" font-family="Arial" font-size="14" font-weight="800" fill="#dc2626">÷</text>
        <g transform="translate(490, 380)">
          <ellipse rx="105" ry="75" fill="#fecaca" stroke="#dc2626" stroke-width="3"/>
          <text x="0" y="-22" text-anchor="middle" font-family="Arial" font-size="13" font-weight="800" fill="#7f1d1d">RPF</text>
          <text x="0" y="6" text-anchor="middle" font-family="Arial" font-size="24" font-weight="800" fill="#7f1d1d">600</text>
          <text x="0" y="30" text-anchor="middle" font-family="Arial" font-size="11" fill="#7f1d1d">mL/min</text>
        </g>
        <path d="M 605 380 L 685 380" stroke="#dc2626" stroke-width="3" fill="none" marker-end="url(#arrow1)"/>
        <g transform="translate(870, 380)">
          <rect x="-145" y="-78" width="290" height="156" rx="16" fill="#dc2626" stroke="#7f1d1d" stroke-width="3"/>
          <text x="0" y="-38" text-anchor="middle" font-family="Arial" font-size="15" font-weight="800" fill="#fff">FILTRATION</text>
          <text x="0" y="-16" text-anchor="middle" font-family="Arial" font-size="15" font-weight="800" fill="#fff">FRACTION</text>
          <text x="0" y="24" text-anchor="middle" font-family="Arial" font-size="32" font-weight="800" fill="#fef3c7">20%</text>
          <text x="0" y="52" text-anchor="middle" font-family="Arial" font-size="11" fill="#fee2e2">FF = GFR / RPF</text>
        </g>
        <text x="600" y="540" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#7f1d1d">Normal FF ≈ 20% · Autoregulated by afferent and efferent arteriolar tone</text>
        <text x="600" y="566" text-anchor="middle" font-family="Arial" font-size="12" fill="#64748b">FF = GFR / RPF = 120 / 600 = 0.20 = 20%</text>
      </g>

      <!-- A2 — CRRT FF -->
      <g id="diagram-opt2" style="display:none">
        <g transform="translate(170, 300)">
          <rect x="-105" y="-58" width="210" height="116" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
          <text x="0" y="-24" text-anchor="middle" font-family="Arial" font-size="12" font-weight="800" fill="#5b21b6">Q_b (blood flow)</text>
          <text x="0" y="6" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#5b21b6">150</text>
          <text x="0" y="30" text-anchor="middle" font-family="Arial" font-size="11" fill="#5b21b6">mL/min</text>
        </g>
        <path d="M 280 300 L 360 300" stroke="#7c3aed" stroke-width="3" fill="none" marker-end="url(#arrow2)"/>
        <text x="320" y="284" text-anchor="middle" font-family="Arial" font-size="10" font-weight="800" fill="#7c3aed">×(1 − Hct)</text>
        <g transform="translate(480, 300)">
          <rect x="-105" y="-58" width="210" height="116" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
          <text x="0" y="-24" text-anchor="middle" font-family="Arial" font-size="12" font-weight="800" fill="#5b21b6">Hct</text>
          <text x="0" y="6" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#5b21b6">30%</text>
          <text x="0" y="30" text-anchor="middle" font-family="Arial" font-size="11" fill="#5b21b6">hematocrit</text>
        </g>
        <path d="M 590 300 L 670 300" stroke="#7c3aed" stroke-width="3" fill="none" marker-end="url(#arrow2)"/>
        <g transform="translate(850, 300)">
          <rect x="-135" y="-62" width="270" height="124" rx="14" fill="#7c3aed" stroke="#5b21b6" stroke-width="3"/>
          <text x="0" y="-26" text-anchor="middle" font-family="Arial" font-size="12" font-weight="800" fill="#fff">Q_p (plasma flow)</text>
          <text x="0" y="8" text-anchor="middle" font-family="Arial" font-size="28" font-weight="800" fill="#fef3c7">105</text>
          <text x="0" y="34" text-anchor="middle" font-family="Arial" font-size="11" fill="#ede9fe">mL/min</text>
        </g>

        <g transform="translate(170, 520)">
          <rect x="-105" y="-58" width="210" height="116" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
          <text x="0" y="-24" text-anchor="middle" font-family="Arial" font-size="12" font-weight="800" fill="#5b21b6">Q_eff (effluent)</text>
          <text x="0" y="6" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#5b21b6">33.3</text>
          <text x="0" y="30" text-anchor="middle" font-family="Arial" font-size="10" fill="#5b21b6">mL/min (2000 mL/h)</text>
        </g>
        <path d="M 280 520 L 360 520" stroke="#7c3aed" stroke-width="3" fill="none" marker-end="url(#arrow2)"/>
        <g transform="translate(480, 520)">
          <rect x="-105" y="-58" width="210" height="116" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
          <text x="0" y="-24" text-anchor="middle" font-family="Arial" font-size="12" font-weight="800" fill="#5b21b6">÷ Q_p</text>
          <text x="0" y="6" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#5b21b6">105</text>
          <text x="0" y="30" text-anchor="middle" font-family="Arial" font-size="11" fill="#5b21b6">mL/min</text>
        </g>
        <path d="M 590 520 L 670 520" stroke="#7c3aed" stroke-width="3" fill="none" marker-end="url(#arrow2)"/>
        <g transform="translate(850, 520)">
          <rect x="-135" y="-62" width="270" height="124" rx="14" fill="#7c3aed" stroke="#5b21b6" stroke-width="3"/>
          <text x="0" y="-26" text-anchor="middle" font-family="Arial" font-size="12" font-weight="800" fill="#fff">CRRT FF</text>
          <text x="0" y="8" text-anchor="middle" font-family="Arial" font-size="28" font-weight="800" fill="#fef3c7">32%</text>
          <text x="0" y="34" text-anchor="middle" font-family="Arial" font-size="11" fill="#ede9fe">Q_eff / Q_p</text>
        </g>
        <text x="600" y="650" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#5b21b6">CRRT FF = Q_eff / Q_p · Target &lt; 25% · Here 33.3 / 105 = 32% → too high</text>
      </g>

      <!-- A3 — HIGH FF -->
      <g id="diagram-opt3" style="display:none">
        <g transform="translate(150, 380)">
          <circle r="78" fill="#cffafe" stroke="#0891b2" stroke-width="3"/>
          <text x="0" y="-10" text-anchor="middle" font-family="Arial" font-size="14" font-weight="800" fill="#155e75">FF</text>
          <text x="0" y="14" text-anchor="middle" font-family="Arial" font-size="18" font-weight="800" fill="#155e75">&gt; 25%</text>
        </g>
        <path d="M 233 380 L 313 380" stroke="#0891b2" stroke-width="3" fill="none" marker-end="url(#arrow3)"/>
        <g transform="translate(440, 380)">
          <rect x="-105" y="-68" width="210" height="136" rx="14" fill="#cffafe" stroke="#0891b2" stroke-width="3" class="pulse-node"/>
          <text x="0" y="-28" text-anchor="middle" font-family="Arial" font-size="12" font-weight="800" fill="#155e75">HEMO-</text>
          <text x="0" y="-8" text-anchor="middle" font-family="Arial" font-size="12" font-weight="800" fill="#155e75">CONCENTRATION</text>
          <text x="0" y="18" text-anchor="middle" font-family="Arial" font-size="10" fill="#155e75">↑ protein at filter</text>
          <text x="0" y="38" text-anchor="middle" font-family="Arial" font-size="10" fill="#155e75">↑ oncotic pressure</text>
        </g>
        <path d="M 545 380 L 625 380" stroke="#0891b2" stroke-width="3" fill="none" marker-end="url(#arrow3)"/>
        <g transform="translate(750, 380)">
          <rect x="-105" y="-68" width="210" height="136" rx="14" fill="#cffafe" stroke="#0891b2" stroke-width="3"/>
          <text x="0" y="-18" text-anchor="middle" font-family="Arial" font-size="12" font-weight="800" fill="#155e75">FILTER</text>
          <text x="0" y="4" text-anchor="middle" font-family="Arial" font-size="12" font-weight="800" fill="#155e75">CLOTTING</text>
          <text x="0" y="30" text-anchor="middle" font-family="Arial" font-size="10" fill="#155e75">↓ filter life</text>
          <text x="0" y="48" text-anchor="middle" font-family="Arial" font-size="10" fill="#155e75">↑ TMP</text>
        </g>
        <path d="M 855 380 L 935 380" stroke="#0891b2" stroke-width="3" fill="none" marker-end="url(#arrow3)"/>
        <g transform="translate(1050, 380)">
          <rect x="-98" y="-78" width="196" height="156" rx="14" fill="#0891b2" stroke="#155e75" stroke-width="3"/>
          <text x="0" y="-38" text-anchor="middle" font-family="Arial" font-size="13" font-weight="800" fill="#fff">INEFFICIENT</text>
          <text x="0" y="-16" text-anchor="middle" font-family="Arial" font-size="13" font-weight="800" fill="#fff">CRRT</text>
          <text x="0" y="12" text-anchor="middle" font-family="Arial" font-size="11" fill="#cffafe">↓ clearance</text>
          <text x="0" y="34" text-anchor="middle" font-family="Arial" font-size="11" fill="#cffafe">↑ nursing burden</text>

    .map(c => `<span class="lab-chip${c.abnormal ? " abn" : ""}${c.pos ? " pos" : ""}">${c.text}</span>`)
    .join("");

  function renderTabs(elId, tabs) {
    document.getElementById(elId).innerHTML = tabs
      .map(t => `<button class="tab ${t.id}" id="tab${t.id}" onclick="setMode('${t.id}')">${t.label}</button>`)
      .join("");
  }
  renderTabs("tabsA", CONFIG.tabsA);
  renderTabs("tabsB", CONFIG.tabsB);

  CONFIG.allTabs = CONFIG.tabsA.concat(CONFIG.tabsB);

  document.getElementById("quizCount").textContent = CONFIG.quiz.length;
  document.getElementById("footerCredit").textContent = CONFIG.footerCredit;
  document.getElementById("footerNote").textContent = CONFIG.footerNote;

  const quizGrid = document.getElementById("quizGrid");
  quizGrid.innerHTML = CONFIG.quiz.map((q, qi) => `
    <div class="q" data-q="${qi}">
      <p>${qi + 1}. ${q.question}</p>
      <div class="opts">
        ${q.options.map((o, oi) => `
          <button class="opt" data-q="${qi}" data-o="${oi}">${o.text}</button>
        `).join("")}
      </div>
      <div class="explain"></div>
    </div>
  `).join("");

  quizGrid.querySelectorAll(".opt").forEach(btn => {
    btn.addEventListener("click", () => {
      const qi = parseInt(btn.dataset.q, 10);
      const oi = parseInt(btn.dataset.o, 10);
      const q = CONFIG.quiz[qi];
      const opt = q.options[oi];
      const box = btn.closest(".q");

      box.querySelectorAll(".opt").forEach(b => b.classList.remove("correct", "wrong"));
      btn.classList.add(opt.correct ? "correct" : "wrong");

      const explain = box.querySelector(".explain");
      if (opt.correct) {
        explain.className = "explain show correct-explain";
        explain.innerHTML = "<strong class='correct'>✔ Correct.</strong> " + opt.explanation;
      } else {
        explain.className = "explain show wrong-explain";
        explain.innerHTML = "<strong class='wrong'>✘ Incorrect.</strong> " + opt.explanation;
      }
    });
  });

  setMode("opt1");
})();

function setMode(mode) {
  const d = CONFIG.modes[mode];
  if (!d) return;

  CONFIG.allTabs.forEach(t => {
    document.getElementById("tab" + t.id).classList.remove("active");
  });
  document.getElementById("tab" + mode).classList.add("active");

  CONFIG.allTabs.forEach(t => {
    document.getElementById("diagram-" + t.id).style.display = "none";
  });
  document.getElementById("diagram-" + mode).style.display = "block";

  document.getElementById("svg-title").textContent = d.svgTitle;
  document.getElementById("svg-subtitle").textContent = d.svgSubtitle;

  document.getElementById("banner-bg").setAttribute("fill", d.bannerBg);
  document.getElementById("banner-text-1").textContent = d.bannerText1;
  document.getElementById("banner-text-2").textContent = d.bannerText2;

  const panel = document.getElementById("infoPanel");
  panel.className = "info-float " + d.panelClass +
    (panel.classList.contains("collapsed") ? " collapsed" : "");

  document.getElementById("infoTitle").textContent = d.infoTitle;
  document.getElementById("infoBody").innerHTML = d.infoRows
    .map(r => `<div class="row"><span class="k">${r.k}</span><span class="v">${r.v}</span></div>`)
    .join("");

  document.getElementById("panel1-title").textContent = d.panel1Title;
  document.getElementById("panel1-tagline").textContent = d.panel1Tagline;
  document.getElementById("panel1-list").innerHTML = d.panel1List.map(li => `<li>${li}</li>`).join("");

  document.getElementById("panel2-title").textContent = d.panel2Title;
  document.getElementById("panel2-tagline").textContent = d.panel2Tagline;
  document.getElementById("panel2-list").innerHTML = d.panel2List.map(li => `<li>${li}</li>`).join("");

  document.getElementById("alertIcon").textContent = d.alertIcon;
  document.getElementById("alertTitle").textContent = d.alertTitle;
  document.getElementById("alertText").innerHTML = d.alertText;
}

let panelCollapsed = false;
function togglePanel() {
  panelCollapsed = !panelCollapsed;
  const panel = document.getElementById("infoPanel");
  const btn = document.getElementById("toggleBtn");
  panel.classList.toggle("collapsed", panelCollapsed);
  btn.textContent = panelCollapsed ? "▼ Show" : "▲ Hide";
}
</script>
</body>
