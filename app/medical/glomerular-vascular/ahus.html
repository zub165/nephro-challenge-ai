<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aHUS — Genetics, Treatment, and Transplant Strategy</title>
<style>
  :root{
    --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --bg:#f1f5f9;
    --accent1:#dc2626; --accent2:#7c3aed; --accent3:#0891b2; --accent4:#ca8a04;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:"Inter","Segoe UI",system-ui,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.5; font-size:16px;}
  .wrap{max-width:1500px;margin:0 auto;padding:20px 18px 40px;}

  header.top{display:flex; flex-wrap:wrap; gap:12px; align-items:center;
    justify-content:space-between; margin-bottom:14px;}
  header.top h1{margin:0; font-size:1.5rem; font-weight:800;}
  header.top p{margin:2px 0 0; font-size:.9rem; color:var(--muted);}
  .badge{background:#0f172a; color:#fff; font-size:.75rem; padding:8px 16px;
    border-radius:999px; letter-spacing:.06em; font-weight:700;}

  .case-strip{background:#fff; border-radius:14px; padding:18px 22px;
    border:1px solid var(--line); border-left:5px solid var(--accent1);
    box-shadow:0 1px 3px rgba(15,23,42,.04); margin-bottom:14px;
    display:flex; flex-wrap:wrap; gap:16px; align-items:center;}
  .case-strip h2{margin:0 0 4px; font-size:1.05rem; font-weight:800; color:#991b1b;}
  .case-strip p{margin:0; font-size:.88rem; color:#334155; line-height:1.6; max-width:680px;}
  .labs{display:flex; gap:8px; flex-wrap:wrap;}
  .lab-chip{background:#f1f5f9; border-radius:9px; padding:7px 14px;
    font-size:.8rem; font-weight:700; color:#1e293b; border:1px solid var(--line);
    font-family:"JetBrains Mono",monospace;}
  .lab-chip.abn{background:#fef2f2; border-color:#fecaca; color:#991b1b;}
  .lab-chip.ok{background:#f0fdf4; border-color:#bbf7d0; color:#166534;}

  .tabs{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;}
  .tab{background:#fff; border:1.5px solid transparent; padding:12px 22px;
    border-radius:10px; font-size:.9rem; font-weight:700; cursor:pointer;
    transition:all .15s ease; color:var(--muted); font-family:inherit;}
  .tab:hover{border-color:#cbd5e1;}
  .tab.opt1.active{background:#fef2f2; border-color:var(--accent1); color:#991b1b;}
  .tab.opt2.active{background:#f5f3ff; border-color:var(--accent2); color:#5b21b6;}
  .tab.opt3.active{background:#cffafe; border-color:var(--accent3); color:#155e75;}
  .tab.opt4.active{background:#fef9c3; border-color:var(--accent4); color:#713f12;}

  .stage{
    background:#fff; border-radius:16px; padding:16px;
    box-shadow:0 1px 3px rgba(15,23,42,.04), 0 4px 14px rgba(15,23,42,.05);
    border:1px solid var(--line);
    display:grid;
    grid-template-columns: minmax(0, 1fr) 320px;
    gap:16px;
    align-items:start;
  }
  @media(max-width:1100px){ .stage{grid-template-columns: 1fr;} }

  .diagram-col{min-width:0;}
  svg.diagram{width:100%; height:auto; display:block;}

  .info-col{position:sticky; top:16px;}
  @media(max-width:1100px){ .info-col{position:static;} }

  .info-float{
    background:#fff; border-radius:12px; border:1px solid var(--line);
    box-shadow:0 4px 14px rgba(15,23,42,.08);
    overflow:hidden; width:100%;
    transition:border-color .2s ease;
  }
  .info-float.highlight-opt1{border-color:var(--accent1);}
  .info-float.highlight-opt2{border-color:var(--accent2);}
  .info-float.highlight-opt3{border-color:var(--accent3);}
  .info-float.highlight-opt4{border-color:var(--accent4);}

  .info-header{display:flex; justify-content:space-between; align-items:center;
    padding:14px 16px; cursor:pointer; user-select:none;
    background:#fef2f2; transition:background .2s ease; gap:8px;}
  .info-float.highlight-opt2 .info-header{background:#f5f3ff;}
  .info-float.highlight-opt3 .info-header{background:#cffafe;}
  .info-float.highlight-opt4 .info-header{background:#fef9c3;}

  .grip{display:inline-flex; gap:2px; flex-direction:column; flex-shrink:0;
    margin-right:6px; opacity:.35;}
  .grip span{width:3px;height:3px;border-radius:50%;background:#475569;display:block;}

  .info-header h4{margin:0; font-size:.9rem; font-weight:800;
    color:#0f172a; flex:1; display:flex; align-items:center; pointer-events:none;}

  .info-header .toggle-btn{font-size:.75rem; color:var(--muted);
    background:rgba(0,0,0,.06); padding:4px 10px; border-radius:999px;
    font-weight:700; flex-shrink:0; cursor:pointer; pointer-events:auto;}

  .info-body{padding:14px 16px 16px; max-height:700px;
    transition:max-height .3s ease, padding .3s ease; overflow:hidden;}
  .info-float.collapsed .info-body{max-height:0; padding:0 16px;}

  .info-float .row{display:flex; justify-content:space-between;
    padding:10px 0; font-size:.85rem; border-bottom:1px solid var(--line); gap:8px;}
  .info-float .row:last-child{border:none;}
  .info-float .k{color:var(--muted); font-weight:600; flex-shrink:0;}
  .info-float .v{font-weight:800; color:#0f172a; text-align:right;
    word-break:break-word; max-width:180px;}

  .compare-section{background:#fff; border-radius:16px; padding:22px 26px;
    margin-top:14px; border:1px solid var(--line);
    box-shadow:0 1px 3px rgba(15,23,42,.04), 0 4px 14px rgba(15,23,42,.05);}
  .compare-section h3{margin:0 0 4px; font-size:1.05rem; font-weight:800;
    display:flex; align-items:center; gap:8px;}
  .compare-section .sub{font-size:.85rem; color:var(--muted); margin:0 0 16px;}
  .compare-table{width:100%; border-collapse:collapse; font-size:.85rem;}
  .compare-table th{text-align:left; padding:12px 14px; font-weight:800;
    font-size:.75rem; text-transform:uppercase; letter-spacing:.05em; color:#fff;}
  .compare-table th:nth-child(1){background:#475569;}
  .compare-table th:nth-child(2){background:#dc2626;}
  .compare-table th:nth-child(3){background:#7c3aed;}
  .compare-table th:nth-child(4){background:#16a34a;}
  .compare-table th:nth-child(5){background:#ca8a04;}
  .compare-table td{padding:12px 14px; border-bottom:1px solid var(--line);
    vertical-align:top; color:#334155; line-height:1.55;}
  .compare-table td:first-child{font-weight:700; color:#0f172a;}
  .compare-table tr.hero{background:#f0fdf4;}
  .compare-table tr.hero td{border-bottom:2px solid #16a34a;}
  .compare-table tr.hero td:first-child{color:#166534;}

  .panels{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px;}
  @media(max-width:800px){.panels{grid-template-columns:1fr;}}
  .panel{background:#fff; border-radius:14px; padding:20px 22px;
    box-shadow:0 1px 3px rgba(15,23,42,.04), 0 4px 14px rgba(15,23,42,.05);
    border:1px solid var(--line); border-top:4px solid var(--accent1);}
  .panel.two{border-top-color:#475569;}
  .panel h3{margin:0 0 4px; font-size:1.05rem; font-weight:800;
    display:flex; align-items:center; gap:8px;}
  .panel .tagline{font-size:.82rem; color:var(--muted); margin:0 0 12px;}
  .panel ul{margin:0; padding-left:20px; font-size:.9rem; color:#334155; line-height:1.7;}
  .panel ul li{margin-bottom:8px;}
  .panel ul li strong{color:#0f172a;}

  .alert{background:linear-gradient(135deg,#dc2626,#ef4444); color:#fff;
    border-radius:14px; padding:22px 26px; margin-top:14px;
    box-shadow:0 4px 16px rgba(220,38,38,.3); display:flex; gap:16px; align-items:center;}
  .alert .icon{font-size:2.6rem; flex-shrink:0;}
  .alert h3{margin:0 0 4px; font-size:1.1rem; font-weight:800;}
  .alert p{margin:0; font-size:.92rem; line-height:1.6; opacity:.95;}
  .alert strong{color:#fef3c7;}

  .quiz{background:#fff; border-radius:16px; padding:24px 26px; margin-top:14px;
    box-shadow:0 1px 3px rgba(15,23,42,.04), 0 4px 14px rgba(15,23,42,.05);
    border:1px solid var(--line);}
  .quiz h3{margin:0 0 18px; font-size:1.05rem; font-weight:800;
    display:flex; align-items:center; gap:8px;}
  .quiz-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  @media(max-width:900px){.quiz-grid{grid-template-columns:1fr;}}
  .q{background:#f8fafc; border-radius:11px; padding:18px 20px; border:1px solid var(--line);}
  .q p{margin:0 0 14px; font-weight:700; font-size:.92rem; line-height:1.55;}
  .opts{display:flex; flex-direction:column; gap:8px; margin-bottom:10px;}
  .opt{border:1.5px solid var(--line); background:#fff; padding:11px 16px;
    border-radius:8px; font-size:.87rem; cursor:pointer; transition:all .15s ease;
    font-weight:600; color:var(--ink); font-family:inherit; text-align:left;}
  .opt:hover{border-color:#94a3b8;}
  .opt.correct{background:#dcfce7; border-color:#16a34a; color:#166534;}
  .opt.wrong{background:#fee2e2; border-color:#ef4444; color:#991b1b;}
  .explain{display:none; background:#fff; border-left:4px solid #94a3b8;
    padding:12px 16px; border-radius:0 8px 8px 0; font-size:.83rem;
    color:#334155; line-height:1.6; margin-top:8px;}
  .explain.show{display:block;}
  .explain.correct-explain{border-left-color:#16a34a; background:#f0fdf4;}
  .explain.wrong-explain{border-left-color:#ef4444; background:#fef2f2;}
  .explain strong.correct{color:#166534;}
  .explain strong.wrong{color:#991b1b;}

  .footer{margin-top:16px; padding:18px 24px; background:#0f172a;
    border-radius:14px; color:#94a3b8; text-align:center;
    font-size:.83rem; line-height:1.6;}
  .footer .footer-gift{
    font-size:1rem; font-weight:800; color:#fbbf24;
    letter-spacing:.04em; margin-bottom:10px;
    padding-bottom:10px; border-bottom:1px solid rgba(255,255,255,.12);
    display:inline-block; padding-left:18px; padding-right:18px;
  }
  .footer .footer-gift strong{color:#fff;}
  .footer .footer-meta{font-size:.83rem; color:#94a3b8;}
  .footer .footer-meta strong{color:#60a5fa;}

  /* ---------- ANIMATION KEYFRAMES ---------- */
  @keyframes flowDash{0%{stroke-dashoffset:0;}100%{stroke-dashoffset:-30;}}
  @keyframes pulse{0%,100%{opacity:1; transform:scale(1);}50%{opacity:.6; transform:scale(1.08);}}
  @keyframes pulseBlock{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.1);opacity:.8;}}
  .flow-anim{stroke-dasharray:8 6; animation:flowDash 1.4s linear infinite;}
  .pulse-node{animation:pulse 1.8s ease-in-out infinite; transform-origin:center;}
  .pulse-block{animation:pulseBlock 1.6s ease-in-out infinite; transform-origin:center;}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <h1 id="pageTitle"></h1>
      <p id="pageSubtitle"></p>
    </div>
    <div class="badge" id="pageBadge"></div>
  </header>

  <div class="case-strip">
    <div>
      <h2 id="caseTitle"></h2>
      <p id="caseDescription"></p>
    </div>
    <div class="labs" id="labChips"></div>
  </div>

  <div class="tabs" id="tabs"></div>

  <section class="stage">
    <div class="diagram-col">
      <svg class="diagram" viewBox="0 0 1400 1000" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="lumenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#e0f2fe"/>
            <stop offset="100%" stop-color="#bae6fd"/>
          </linearGradient>
          <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#dc2626"/>
          </marker>
          <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#16a34a"/>
          </marker>
          <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2563eb"/>
          </marker>
          <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7c3aed"/>
          </marker>
          <marker id="arrowSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
          </marker>
        </defs>

        <rect width="1400" height="1000" fill="#fdfdfd"/>

        <text id="svg-title" x="700" y="40" text-anchor="middle" font-family="Arial" font-size="24" font-weight="800" fill="#0f172a"></text>
        <text id="svg-subtitle" x="700" y="70" text-anchor="middle" font-family="Arial" font-size="16" fill="#64748b"></text>

        <!-- ============================================================
             SCENE 1 — GENETIC LANDSCAPE
             ============================================================ -->
        <g id="diagram-opt1" style="display:none">
          
          <g transform="translate(700, 145)">
            <rect x="-620" y="-55" width="1240" height="110" rx="22" fill="#fef2f2" stroke="#dc2626" stroke-width="4"/>
            <text x="0" y="-14" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#991b1b">THE GENETIC LANDSCAPE OF aHUS</text>
            <text x="0" y="14" text-anchor="middle" font-family="Arial" font-size="15" fill="#7f1d1d">Loss-of-function in regulators vs. gain-of-function in activators</text>
            <text x="0" y="40" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#991b1b">Beyond CD46: CFH, CFI, C3, CFB, THBD, CFHR5, and DGKE</text>
          </g>

          <!-- Card 1: Regulators -->
          <g transform="translate(250, 430)">
            <rect x="-200" y="-175" width="400" height="350" rx="20" fill="#fff" stroke="#dc2626" stroke-width="4"/>
            <rect x="-200" y="-175" width="400" height="58" rx="20" fill="#dc2626"/>
            <rect x="-200" y="-137" width="400" height="20" fill="#dc2626"/>
            <text x="0" y="-140" text-anchor="middle" font-family="Arial" font-size="15" font-weight="800" fill="#fff">LOSS-OF-FUNCTION</text>

            <text x="0" y="-88" text-anchor="middle" font-family="Arial" font-size="16" font-weight="800" fill="#991b1b">Regulators</text>
            <line x1="-150" y1="-64" x2="150" y2="-64" stroke="#fecaca" stroke-width="2"/>

            <g font-family="Arial" font-size="13" fill="#334155">
              <text x="-170" y="-34" font-weight="800" fill="#991b1b">• CFH (Factor H)</text>
              <text x="-150" y="-14">Most common</text>
              <text x="-170" y="14" font-weight="800" fill="#991b1b">• CFI (Factor I)</text>
              <text x="-150" y="34">Cleaves C3b</text>
              <text x="-170" y="62" font-weight="800" fill="#991b1b">• CD46 (MCP)</text>
              <text x="-150" y="82">Membrane-bound cofactor</text>
              <text x="-170" y="110" font-weight="800" fill="#991b1b">• THBD</text>
              <text x="-150" y="130">Thrombomodulin</text>
            </g>
          </g>

          <!-- Card 2: Activators -->
          <g transform="translate(700, 430)">
            <rect x="-200" y="-175" width="400" height="350" rx="20" fill="#fff" stroke="#7c3aed" stroke-width="4"/>
            <rect x="-200" y="-175" width="400" height="58" rx="20" fill="#7c3aed"/>
            <rect x="-200" y="-137" width="400" height="20" fill="#7c3aed"/>
            <text x="0" y="-140" text-anchor="middle" font-family="Arial" font-size="15" font-weight="800" fill="#fff">GAIN-OF-FUNCTION</text>

            <text x="0" y="-88" text-anchor="middle" font-family="Arial" font-size="16" font-weight="800" fill="#5b21b6">Activators</text>
            <line x1="-150" y1="-64" x2="150" y2="-64" stroke="#ddd6fe" stroke-width="2"/>

            <g font-family="Arial" font-size="13" fill="#334155">
              <text x="-170" y="-34" font-weight="800" fill="#5b21b6">• C3</text>
              <text x="-150" y="-14">Resists regulation</text>
              <text x="-170" y="14" font-weight="800" fill="#5b21b6">• CFB (Factor B)</text>
              <text x="-150" y="34">Stabilizes convertase</text>
              <text x="-170" y="62" font-weight="800" fill="#5b21b6">• CFHR5</text>
              <text x="-150" y="82">Competes with Factor H</text>
            </g>
          </g>

          <!-- Card 3: DGKE -->
          <g transform="translate(1150, 430)">
            <rect x="-200" y="-175" width="400" height="350" rx="20" fill="#fff" stroke="#0891b2" stroke-width="4"/>
            <rect x="-200" y="-175" width="400" height="58" rx="20" fill="#0891b2"/>
            <rect x="-200" y="-137" width="400" height="20" fill="#0891b2"/>
            <text x="0" y="-140" text-anchor="middle" font-family="Arial" font-size="15" font-weight="800" fill="#fff">THE EXCEPTION</text>

            <text x="0" y="-88" text-anchor="middle" font-family="Arial" font-size="18" font-weight="800" fill="#155e75">DGKE</text>
            <line x1="-150" y1="-64" x2="150" y2="-64" stroke="#cffafe" stroke-width="2"/>

            <g font-family="Arial" font-size="13" fill="#334155">
              <text x="-170" y="-34">• Diacylglycerol kinase epsilon</text>
              <text x="-170" y="-10">• <tspan font-weight="800" fill="#991b1b">NOT a complement gene</tspan></text>
              <text x="-170" y="14">• Protein kinase C signaling</text>
              <text x="-170" y="38">• Presents in infancy/childhood</text>
              <text x="-170" y="62">• Endothelial damage</text>
            </g>

            <rect x="-170" y="90" width="340" height="42" rx="8" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
            <text x="0" y="116" text-anchor="middle" font-family="Arial" font-size="13" font-weight="800" fill="#155e75">Role of C5 inhibitors uncertain</text>
          </g>
        </g>

        <!-- ============================================================
             SCENE 2 — MUTATION & TRANSPLANT RISK
             ============================================================ -->
        <g id="diagram-opt2" style="display:none">
          
          <g transform="translate(700, 145)">
            <rect x="-620" y="-55" width="1240" height="110" rx="22" fill="#f5f3ff" stroke="#7c3aed" stroke-width="4"/>
            <text x="0" y="-14" text-anchor="middle" font-family="Arial" font-size="22" font-weight="800" fill="#5b21b6">TRANSPLANT RECURRENCE RISK BY MUTATION</text>
            <text x="0" y="14" text-anchor="middle" font-family="Arial" font-size="15" fill="#6d28d9">Why genetic testing is critical before transplant</text>
            <text x="0" y="40" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#5b21b6">High-risk mutations need prophylaxis; CD46 mutation does not</text>
          </g>

          <!-- High Risk -->
          <g transform="translate(350, 430)">
            <rect x="-290" y="-175" width="580" height="350" rx="18" fill="#fff" stroke="#dc2626" stroke-width="4"/>
            <rect x="-290" y="-175" width="580" height="58" rx="18" fill="#dc2626"/>
            <rect x="-290" y="-137" width="580" height="20" fill="#dc2626"/>
            <text x="0" y="-140" text-anchor="middle" font-family="Arial" font-size="16" font-weight="800" fill="#fff">HIGH RECURRENCE RISK</text>

            <text x="0" y="-88" text-anchor="middle" font-family="Arial" font-size="16" font-weight="800" fill="#991b1b">Circulating Factors</text>
            <line x1="-260" y1="-64" x2="260" y2="-64" stroke="#fecaca" stroke-width="2"/>

            <g font-family="Arial" font-size="14" fill="#334155">
              <text x="-260" y="-30" font-weight="800" fill="#991b1b">Mutations:</text>
              <text x="-100" y="-30">CFH · CFI · C3 · CFB</text>
              
              <text x="-260" y="6" font-weight="800" fill="#991b1b">Recurrence:</text>
              <text x="-100" y="6" font-weight="800" fill="#dc2626">80–90%</text>
              
              <text x="-260" y="42" font-weight="800" fill="#991b1b">Strategy:</text>
              <text x="-100" y="42">Prophylactic C5 inhibitor</text>
              <text x="-100" y="62">(eculizumab or ravulizumab)</text>
            </g>

            <rect x="-260" y="88" width="520" height="52" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
            <text x="0" y="108" text-anchor="middle" font-family="Arial" font-size="13" font-weight="800" fill="#991b1b">Without prophylaxis → rapid graft loss</text>
            <text x="0" y="126" text-anchor="middle" font-family="Arial" font-size="12" fill="#b91c1c">Donor kidney is exposed to the patient's defective fluid-phase regulators</text>
          </g>

          <!-- Low Risk -->
          <g transform="translate(1050, 430)">
            <rect x="-290" y="-175" width="580" height="350" rx="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="5"/>
            <rect x="-290" y="-175" width="580" height="58" rx="18" fill="#16a34a"/>
            <rect x="-290" y="-137" width="580" height="20" fill="#16a34a"/>
            <text x="0" y="-140" text-anchor="middle" font-family="Arial" font-size="16" font-weight="800" fill="#fff">LOW RECURRENCE RISK</text>

            <text x="0" y="-88" text-anchor="middle" font-family="Arial" font-size="16" font-weight="800" fill="#166534">Membrane-Bound Factor</text>
            <line x1="-260" y1="-64" x2="260" y2="-64" stroke="#bbf7d0" stroke-width="2"/>

            <g font-family="Arial" font-size="14" fill="#334155">
              <text x="-260" y="-30" font-weight="800" fill="#166534">Mutation:</text>
              <text x="-100" y="-30">CD46 (MCP)</text>
              
              <text x="-260" y="6" font-weight="800" fill="#166534">Recurrence:</text>
              <text x="-100" y="6" font-weight="800" fill="#166534">&lt; 10%</text>

    },

function shuffleOptions(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

var RUNTIME_QUIZ = CONFIG.quiz.map(function (q) {
  return { question: q.question, options: shuffleOptions(q.options) };
});

var panelCollapsed = false;

function render() {
  document.title = CONFIG.title;
  document.getElementById('pageTitle').textContent = CONFIG.title;
  document.getElementById('pageSubtitle').textContent = CONFIG.subtitle;
  document.getElementById('pageBadge').textContent = CONFIG.badge;
  document.getElementById('caseTitle').textContent = CONFIG.caseTitle;
  document.getElementById('caseDescription').textContent = CONFIG.caseDescription;
  document.getElementById('footerCredit').textContent = CONFIG.footerCredit;
  document.getElementById('footerNote').textContent = CONFIG.footerNote;

  document.getElementById('labChips').innerHTML = CONFIG.labChips.map(function (c) {
    return '<span class="lab-chip' + (c.abnormal ? ' abn' : ' ok') + '">' + c.text + '</span>';
  }).join('');

  document.getElementById('tabs').innerHTML = CONFIG.tabs.map(function (t) {
    return '<button class="tab ' + t.className + '" id="tab' + t.id +
           '" onclick="setMode(\'' + t.id + '\')">' + t.label + '</button>';
  }).join('');

  var cs = document.getElementById('compareSection');
  if (!CONFIG.comparison) {
    cs.style.display = 'none';
  } else {
    cs.style.display = '';
    document.getElementById('compareTitle').textContent = CONFIG.comparison.title;
    document.getElementById('compareSub').textContent = CONFIG.comparison.sub;
    document.getElementById('compareHead').innerHTML =
      '<tr>' + CONFIG.comparison.head.map(function (h) { return '<th>' + h + '</th>'; }).join('') + '</tr>';
    document.getElementById('compareBody').innerHTML = CONFIG.comparison.rows.map(function (r) {
      return '<tr' + (r.hero ? ' class="hero"' : '') + '>' +
        r.cells.map(function (c) { return '<td>' + c + '</td>'; }).join('') +
      '</tr>';
    }).join('');
  }

  document.getElementById('quizCount').textContent = RUNTIME_QUIZ.length;
  document.getElementById('quizGrid').innerHTML = RUNTIME_QUIZ.map(function (q, qi) {
    return '<div class="q" data-qi="' + qi + '">' +
      '<p>' + (qi + 1) + '. ' + q.question + '</p>' +
      '<div class="opts">' +
        q.options.map(function (o, oi) {
          return '<button class="opt" data-qi="' + qi + '" data-oi="' + oi + '">' + o.text + '</button>';
        }).join('') +
      '</div>' +
      '<div class="explain"></div>' +
    '</div>';
  }).join('');
}

function setMode(mode) {
  var d = CONFIG.modes[mode];
  if (!d) return;

  CONFIG.tabs.forEach(function (t) {
    var el = document.getElementById('tab' + t.id);
    if (el) el.classList.remove('active');
  });
  var activeTab = document.getElementById('tab' + mode);
  if (activeTab) activeTab.classList.add('active');

  CONFIG.tabs.forEach(function (t) {
    var g = document.getElementById('diagram-' + t.id);
    if (g) g.style.display = (t.id === mode) ? 'block' : 'none';
  });

  document.getElementById('svg-title').textContent = d.svgTitle;
  document.getElementById('svg-subtitle').textContent = d.svgSubtitle;

  document.getElementById('banner-bg').setAttribute('fill', d.bannerBg);
  document.getElementById('banner-text-1').textContent = d.bannerText1;
  document.getElementById('banner-text-2').textContent = d.bannerText2;

  var panel = document.getElementById('infoPanel');
  panel.className = 'info-float ' + d.panelClass + (panelCollapsed ? ' collapsed' : '');
  document.getElementById('infoTitle').textContent = d.title;

  document.getElementById('infoBody').innerHTML = d.infoRows.map(function (r) {
    return '<div class="row"><span class="k">' + r.k + '</span><span class="v">' + r.v + '</span></div>';
  }).join('');

  document.getElementById('panel1-title').textContent = d.panel1Title;
  document.getElementById('panel1-tagline').textContent = d.panel1Tagline;
  document.getElementById('panel1-list').innerHTML = d.panel1List.map(function (li) {
    return '<li>' + li + '</li>';
  }).join('');

  document.getElementById('panel2-title').textContent = d.panel2Title;
  document.getElementById('panel2-tagline').textContent = d.panel2Tagline;
  document.getElementById('panel2-list').innerHTML = d.panel2List.map(function (li) {
    return '<li>' + li + '</li>';
  }).join('');

  document.getElementById('alertIcon').textContent = d.alertIcon;
  document.getElementById('alertTitle').textContent = d.alertTitle;
  document.getElementById('alertText').innerHTML = d.alertText;
}

function togglePanel(e) {
  if (e) e.stopPropagation();
  panelCollapsed = !panelCollapsed;
  var panel = document.getElementById('infoPanel');
  var btn = document.getElementById('toggleBtn');
  panel.classList.toggle('collapsed', panelCollapsed);
  btn.textContent = panelCollapsed ? '▼ Show' : '▲ Hide';
}

document.getElementById('quizGrid').addEventListener('click', function (e) {
  var btn = e.target.closest('.opt');
  if (!btn) return;
  var qi = parseInt(btn.dataset.qi, 10);
  var oi = parseInt(btn.dataset.oi, 10);
  var o = RUNTIME_QUIZ[qi].options[oi];
  var box = btn.closest('.q');

  box.querySelectorAll('.opt').forEach(function (b) {
    b.classList.remove('correct', 'wrong');
  });
  btn.classList.add(o.correct ? 'correct' : 'wrong');

  var explain = box.querySelector('.explain');
  explain.className = 'explain show ' + (o.correct ? 'correct-explain' : 'wrong-explain');
  explain.innerHTML = '<strong class="' + (o.correct ? 'correct' : 'wrong') + '">' +
    (o.correct ? '✔ Correct.' : '✘ Not quite.') + '</strong> ' + o.explanation;
});

render();
setMode(CONFIG.tabs[0].id);
</script>
</body>
</html>
