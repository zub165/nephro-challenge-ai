# Nginx site for Django API on GoDaddy VPS
# Install: sudo cp api.nephrochallenge.ai.conf /etc/nginx/sites-available/
#          sudo ln -sf /etc/nginx/sites-available/api.nephrochallenge.ai.conf /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx

upstream nephro_api {
    server 127.0.0.1:8007;
}

server {
    listen 80;
    server_name api.nephrochallenge.ai;

    client_max_body_size 20M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.nephrochallenge.ai;

    # Certbot fills these paths after: sudo certbot --nginx -d api.nephrochallenge.ai
    ssl_certificate /etc/letsencrypt/live/api.nephrochallenge.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.nephrochallenge.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    location /static/ {
        alias /var/www/nephro-challenge-ai/backend/static/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /var/www/nephro-challenge-ai/backend/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://nephro_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }
}
